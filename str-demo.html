<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STR Registration &amp; Oversight — Metro Nashville-Davidson County</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("str-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");}catch(e){document.documentElement.dataset.theme="dark";}</script>
<style>
  :root {
    --bg: #14171c; --panel: #1d2129; --panel2: #232936; --line: #333b4a;
    --ink: #e8eaf0; --dim: #a8b1c3; --faint: #8f99ab;
    --gold: #e8b93e; --live: #4cc38a; --dummy: #e8863e; --mode: #6aa8ff; --bad: #f07575;
    --brand: #1D4ED8; --link: #8fabff; --teal: #2bc5cb; --danger: #A8071A;
    --mock: #101319; --mbar: #39424f; --mbar2: #4a5a75; --mapbg: #161b26; --mapline: #232b3a;
  }
  html[data-theme="light"] {
    --bg: #f2f4f7; --panel: #ffffff; --panel2: #e9edf3; --line: #d8dee8;
    --ink: #1b2029; --dim: #5b6474; --faint: #606a7c;
    --gold: #7c600a; --live: #1d8a56; --dummy: #b25a18; --mode: #2b5fc7; --bad: #b52f2f;
    --brand: #1D4ED8; --link: #1D4ED8; --teal: #06777b; --danger: #A8071A;
    --mock: #edf1f6; --mbar: #c7d1df; --mbar2: #a9b6cb; --mapbg: #e4eaf2; --mapline: #c3cede;
  }
  :focus-visible { outline: 2px solid var(--mode); outline-offset: 2px; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 24px; border-bottom: 1px solid #10131a; background: #23262e; color: #e8eaf0; position: sticky; top: 0; z-index: 20; }
  header .brand { font-weight: 800; font-size: 15px; color: #fff; letter-spacing: .4px; flex-shrink: 0; }
  header .brand small { display: block; font-weight: 400; font-size: 11px; color: #a8b1c3; letter-spacing: 0; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
  header nav a { color: #c3c9d4; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
  header nav a:hover { background: #2e333d; color: #fff; text-decoration: none; }
  header nav a.active { background: var(--brand); color: #fff; font-weight: 700; }
  .pseg { display: flex; border: 1px solid #4a505c; border-radius: 24px; overflow: hidden; margin-left: auto; flex-shrink: 0; }
  .pseg button { background: transparent; border: none; color: #c3c9d4; font-size: 12px; padding: 5px 14px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .pseg button.on { background: var(--brand); color: #fff; font-weight: 700; }
  .iconbtn { background: transparent; border: 1px solid #4a505c; color: #c3c9d4; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 14px; line-height: 1; flex-shrink: 0; }
  .iconbtn:hover { border-color: var(--link); color: #fff; }
  .iconbtn.on { border-color: var(--brand); background: var(--brand); color: #fff; }
  .xsrc { display: none; }
  body.xray .xsrc { display: inline-block; font-size: 10px; font-weight: 400; color: var(--teal); border: 1px dashed var(--teal); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; white-space: nowrap; }
  .modepill { font-size: 11.5px; border: 1px solid #8fabff; color: #8fabff; border-radius: 24px; padding: 3px 12px; white-space: nowrap; flex-shrink: 0; }
  @media (max-width: 760px) {
    header { padding: 10px 14px; }
    .modepill { display: none; }
    header nav { order: 3; flex-basis: 100%; }
  }
  main { padding: 24px 32px 60px; max-width: 1100px; margin: 0 auto; }
  .crumb { font-size: 11.5px; color: var(--faint); margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  .lede { color: var(--dim); max-width: 800px; margin: 0 0 16px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card.click { display: block; color: var(--ink); width: 300px; }
  .card.click:hover { border-color: var(--gold); text-decoration: none; }
  .card h3 { font-size: 14px; margin: 0 0 2px; }
  .card .route { font-family: ui-monospace, monospace; font-size: 11px; color: var(--faint); margin-bottom: 6px; }
  .card p { font-size: 12px; color: var(--dim); margin: 6px 0 0; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin: 0 4px 4px 0; }
  .tag.live { background: rgba(76,195,138,.15); color: var(--live); border: 1px solid var(--live); }
  .tag.dummy { background: rgba(232,134,62,.13); color: var(--dummy); border: 1px solid var(--dummy); }
  .tag.real { background: rgba(106,168,255,.13); color: var(--mode); border: 1px solid var(--mode); }
  .tag.prop { background: transparent; color: var(--faint); border: 1px dashed var(--faint); }
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 7px; }
  .chip.ok { background: rgba(76,195,138,.15); color: var(--live); }
  .chip.warn { background: rgba(232,185,62,.15); color: var(--gold); }
  .chip.bad { background: rgba(220,70,70,.14); color: var(--bad); }
  .chip.mut { background: var(--panel2); color: var(--dim); }
  /* ── compliance calendar (Job 9: upcoming booking dates for inspection) ── */
  .heat { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 8px 0; }
  .heat th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); padding: 5px 6px; }
  .heat td { padding: 4px; text-align: center; }
  .heat td.addr { text-align: left; padding: 5px 8px 5px 0; white-space: nowrap; font-size: 12px; }
  .heat .hc { height: 22px; border-radius: 4px; }
  .heat .hc.s2 { background: #8a7ee0; } /* booked, strong signal */
  .heat .hc.s1 { background: var(--gold); opacity: .75; } /* booked, inferred */
  .heat .hc.s0 { background: var(--mock); border: 1px solid var(--line); } /* no signal */
  .heat-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin: 8px 0 14px; }
  .heat-legend i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .cal-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .cal-toolbar .cal-month-label { font-weight: 700; font-size: 13px; min-width: 140px; text-align: center; }
  .cal-fchip { padding: 3px 9px; font-size: 10.5px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); border-radius: 4px; cursor: pointer; }
  .cal-fchip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .cal-body { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: start; }
  @media (max-width: 760px) { .cal-body { grid-template-columns: 1fr; } }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); text-align: center; padding-bottom: 2px; }
  .cal-cell { border: 1px solid var(--line); min-height: 56px; padding: 3px; font-size: 9.5px; cursor: pointer; border-radius: 4px; }
  .cal-cell.empty { border-color: transparent; cursor: default; }
  .cal-cell.today { border-color: var(--mode); border-width: 2px; }
  .cal-cell.selected { background: var(--panel2); }
  .cal-cell:hover:not(.empty) { background: var(--panel2); }
  .cal-daynum { font-weight: 700; color: var(--dim); margin-bottom: 2px; }
  .cal-cell.today .cal-daynum { color: var(--mode); }
  .cal-chip { padding: 1px 3px; margin-bottom: 1px; border-radius: 2px; font-size: 8.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip.cal-scheduled { background: var(--mode); }
  .cal-chip.cal-completed { background: var(--live); }
  .cal-chip.cal-overdue { background: var(--bad); }
  .cal-agenda { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
  .cal-agenda h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); margin: 0 0 8px; }
  .cal-record { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); padding: 7px 9px; margin-bottom: 8px; font-size: 11.5px; }
  .cal-record-kind { font-weight: 700; text-transform: capitalize; }
  .cal-record-note { color: var(--dim); margin: 4px 0; line-height: 1.4; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
  table.grid th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); border-bottom: 1px solid var(--line); padding: 6px 8px; }
  table.grid td { border-bottom: 1px solid var(--line); padding: 7px 8px; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid tr.hl td { background: rgba(232,185,62,.08); }
  .btn { display: inline-block; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; margin: 4px 6px 4px 0; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.sm { padding: 4px 10px; font-size: 11.5px; }
  [data-cmd-filter] { cursor: pointer; }
  label.f { display: block; font-size: 11.5px; color: var(--dim); margin: 10px 0 3px; }
  input.f, select.f, textarea.f { width: 100%; max-width: 460px; background: var(--mock); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .cols > div { flex: 1; min-width: 280px; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .stat div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 110px; }
  .stat b { font-size: 22px; display: block; }
  .stat small { color: var(--dim); font-size: 11px; }
  .mapbig { position: relative; border: 1px solid var(--line); border-radius: 8px; min-height: 340px;
    background-color: var(--mapbg);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 26px, var(--mapline) 26px 28px),
      repeating-linear-gradient(90deg, transparent 0 40px, var(--mapline) 40px 42px); }
  .pin { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--dummy); box-shadow: 0 0 8px var(--dummy); cursor: pointer; transform: translate(-50%,-50%); }
  .pin.g { background: var(--live); box-shadow: 0 0 8px var(--live); }
  .pin.b { background: var(--mode); box-shadow: 0 0 8px var(--mode); }
  .pin.sel { outline: 2px solid var(--ink); width: 16px; height: 16px; }
  .pinlbl { position: absolute; transform: translate(10px,-50%); font-size: 10.5px; background: var(--mock); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; white-space: nowrap; display: none; }
  .pin.sel + .pinlbl { display: block; }
  .steps { display: flex; gap: 0; margin: 14px 0; flex-wrap: wrap; }
  .steps a { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--line); border-left: none; padding: 8px 10px; font-size: 12px; color: var(--dim); }
  .steps a:first-child { border-left: 1px solid var(--line); border-radius: 8px 0 0 8px; }
  .steps a:last-child { border-radius: 0 8px 8px 0; }
  .steps a:hover { text-decoration: none; color: var(--ink); }
  .steps a.done { color: var(--live); }
  .steps a.cur { color: var(--link); font-weight: 700; background: var(--panel2); }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel); border: 1px solid var(--gold); color: var(--ink); border-radius: 8px; padding: 10px 18px; font-size: 12.5px; opacity: 0; transition: all .25s; z-index: 99; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .quote { border-left: 3px solid var(--brand); margin: 8px 0 4px; padding: 10px 14px; font-style: italic; color: var(--ink); background: var(--mock); border-radius: 0 6px 6px 0; font-size: 13px; }
  .src-link { font-size: 11.5px; }
  .src-link a { color: var(--teal); }
  footer { margin-top: 34px; font-size: 11px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">NASHVILLE<small>STR oversight · Davidson County</small></div>
  <nav id="topnav"></nav>
  <div class="pseg" id="pseg"><button data-p="host">Host</button><button data-p="staff">Compliance</button></div>
  <button class="iconbtn" id="theme-btn" title="Toggle light / dark">☾</button>
  <button class="iconbtn" id="xray-btn" title="X-ray: show field sources" style="width:auto;border-radius:15px;padding:0 10px;font-size:11px;">X-ray</button>
  <div class="modepill">● Metro Nashville-Davidson County</div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
/* ── records ── */
const PARCELS = [
  { addr: "412 Oak St", ev: 3, first: "04/16/2026", last: "07/23/2026" },
  { addr: "418 Oak St", ev: 2, first: "06/05/2026", last: "07/01/2026" },
  { addr: "77 Sample Ave", ev: 4, first: "03/02/2026", last: "08/11/2026" },
  { addr: "9 Demo Pl", ev: 2, first: "05/19/2026", last: "07/30/2026" },
  { addr: "301 Demo Rd", ev: 5, first: "02/11/2026", last: "08/02/2026" },
];
const LICENSES = [
  { n: "STR-1042", st: "active", rooms: 3, max: 6, parcel: "412 Oak St" },
  { n: "STR-2088", st: "pending", rooms: 2, max: 4, parcel: "418 Oak St" },
  { n: "STR-3117", st: "expired", rooms: 4, max: 8, parcel: "301 Demo Rd" },
  { n: "STR-4220", st: "active", rooms: 1, max: 2, parcel: "9 Demo Pl" },
];
const LISTINGS = [
  { pf: "airbnb", beds: 3, rate: 189, match: "CLEAR", addr: "412 Oak St" },
  { pf: "airbnb", beds: 2, rate: 145, match: "CLEAR", addr: "418 Oak St" },
  { pf: "vrbo", beds: 4, rate: 260, match: "MARGINAL", addr: "77 Sample Ave" },
  { pf: "airbnb", beds: 2, rate: 120, match: "CLEAR", addr: "9 Demo Pl" },
  { pf: "vrbo", beds: 5, rate: 310, match: "CLEAR", addr: "301 Demo Rd" },
  { pf: "airbnb", beds: 3, rate: 175, match: "UNLOCATED", addr: "—" },
];
const DETECTION = [
  { addr: "412 Oak St", match: "CLEAR", reg: "NONE", flag: "Per-owner: 3 listings, 1 owner" },
  { addr: "418 Oak St", match: "CLEAR", reg: "NONE", flag: "Per-owner: same owner" },
  { addr: "77 Sample Ave", match: "MARGINAL", reg: "NONE", flag: "Held back: address not certain" },
  { addr: "301 Demo Rd", match: "CLEAR", reg: "EXPIRED", flag: "Unregistered — license lapsed" },
  { addr: "9 Demo Pl", match: "CLEAR", reg: "ACTIVE", flag: "Non-owner-occupied in R-zone" },
];
const QUEUE = [
  { n: 1, stop: "301 Demo Rd — occupied until 11am", m: "CLEAR" },
  { n: 2, stop: "88 Example Ave — check-in likely after 3pm", m: "MARGINAL" },
  { n: 3, stop: "14 Sample St — block starts Sat", m: "MARGINAL" },
];
const TIMELINE = [
  ["08:12:04", "ins", "listing_9f2c — airbnb detection observed (3 br, $189)"],
  ["08:12:05", "con", "listing_9f2c detected_at parcel_412-oak (CLEAR)"],
  ["08:12:06", "ins", "license_str1042 — STR-1042 active, 3 guestrooms"],
  ["08:12:07", "con", "license_str1042 licenses parcel_412-oak"],
  ["08:13:31", "def", "standing_77-sample responsible_agent = owner_demo1"],
  ["08:13:32", "seg", "standing_77-sample → open"],
  ["08:14:02", "ins", "notice_n44 — code-compliance notice via portal"],
  ["08:15:44", "con", "listing_x71a detected_at parcel_301-demo (CLEAR)"],
  ["08:15:45", "eva", "parcel_301-demo vs license_str3117 → EXPIRED"],
  ["08:16:10", "seg", "standing_301-demo → open"],
];

/* ── compliance calendar (Job 9: "upcoming booking dates for inspection" —
   no calendar exists in Slate or Building Blocks today, so this is the
   demo's own answer). Two views share one small dummy dataset generated
   deterministically over the known addresses:
     - oversee/inspect: today's stops + a 7-day booking-likelihood heatmap
       (addresses × days, PDF slide "Next 7 days — when each address is
       likely in use": purple = booked/strong signal, gold = booked/
       inferred, empty = no signal)
     - oversee/calendar: a month grid + day agenda of compliance events
       (inspections, notices, license renewals, tax audits), each entry
       linking to the property profile when one exists. ── */
const CAL_ADDRS = [...new Set([...PARCELS.map((p) => p.addr), "88 Example Ave", "14 Sample St", "52 Mock Ln"])];
const CAL_KINDS = ["inspection", "notice", "license-renewal", "tax-audit"];
const CAL_NOTES = {
  "inspection": ["Field visit — verify guest capacity and posted permit.", "Follow-up inspection after a 311 complaint.", "Life-safety check (egress, smoke detectors)."],
  "notice": ["Registration-obligation notice mailed to owner.", "Compliance notice re: expired license.", "Courtesy notice — renewal due within 30 days."],
  "license-renewal": ["STR license renewal window opens.", "Renewal — payment and inspection both required.", "Late renewal — grace period ends."],
  "tax-audit": ["Hotel/occupancy tax reconciliation against platform-reported revenue.", "Spot audit — booking count vs. remitted tax."],
};
function calMulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function calEpochDayUTC(y, m, d) { return Math.floor(Date.UTC(y, m, d) / 86400000); }
function calTodayEpochDay() { return Math.floor(Date.now() / 86400000); }
function calEpochDayToDate(ed) { return new Date(ed * 86400000); }
function genCalRecords() {
  const rand = calMulberry32(0xB00C1E);
  const today = calTodayEpochDay();
  const out = [];
  let id = 1;
  CAL_ADDRS.forEach((addr) => {
    const n = 4 + Math.floor(rand() * 4); // 4-7 records per address
    for (let i = 0; i < n; i++) {
      const kind = CAL_KINDS[Math.floor(rand() * CAL_KINDS.length)];
      const dayOffset = Math.floor(rand() * 150) - 75; // ~10 weeks back .. ~5 weeks ahead
      const dateEpochDay = today + dayOffset;
      const status = dayOffset < -2 ? (rand() < 0.8 ? "completed" : "overdue") : "scheduled";
      const pool = CAL_NOTES[kind];
      out.push({ id: id++, addr, kind, status, dateEpochDay, note: pool[Math.floor(rand() * pool.length)] });
    }
  });
  return out;
}
const CAL_RECORDS = genCalRecords();
function genHeatRow(addr) {
  const rand = calMulberry32([...addr].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7));
  const today = calTodayEpochDay();
  return Array.from({ length: 7 }, (_, i) => {
    const ed = today + i;
    const r = calMulberry32((rand() * 1e9) | (ed & 0xff));
    const roll = r();
    return roll > 0.72 ? 2 : roll > 0.45 ? 1 : 0; // 2=strong, 1=inferred, 0=none
  });
}
function calSlugFor(addr) { return Object.entries(PROPS).find(([, p]) => p.addr === addr)?.[0] || null; }
function calAddrLink(addr) { const slug = calSlugFor(addr); return slug ? link("properties/" + slug, addr) : esc(addr); }

/* ── nav config ── */
const TOPS = {
  host: [["", "Home"], ["register", "Register"], ["code", "Code"], ["properties", "My properties"]],
  staff: [["", "Home"], ["oversee/detection", "Oversee"], ["oversee/calendar", "Calendar"], ["data/bridge", "Evidence"], ["code", "Code"], ["workbench/staff", "Workbench"]],
};
/* surfaces each persona may open — everything else renders a gate card.
   code (extracted obligations) is shared: hosts read the reasons, compliance reads the versions. */
const SURFACES = { host: ["", "register", "code", "properties"], staff: ["", "oversee", "data", "code", "parcel", "workbench/staff"] };
function allowed(route) { return SURFACES[persona].some((p) => route === p || (p && route.startsWith(p + "/"))); }
function ownerOf(route) {
  if (route === "" || route.startsWith("register") || route.startsWith("properties")) return "host";
  return "staff";
}
function personaLanding() { return persona === "staff" ? "oversee/detection" : ""; }
function pGate(route) {
  const need = ownerOf(route);
  const other = need === "host" ? "Host" : "Compliance";
  return '<div class="crumb">Restricted</div><h1>' + other + "-only surface</h1>" +
    '<p class="lede">This area belongs to ' + (need === "host" ? "hosts" : "compliance") + ". Switch to open it — everything else stays where it was.</p>" +
    '<div class="card"><button class="btn primary" id="gate-switch" data-p="' + need + '">Switch to ' + other + "</button> " +
    '<a class="btn" href="#/' + personaLanding() + '">Back to my home</a></div>';
}
let persona = "host"; // always land as host; compliance is a sign-in away
function setPersona(p) {
  persona = p;
  const r = location.hash.replace(/^#\/?/, "");
  if (allowed(r)) render();
  else location.hash = "#/" + personaLanding();
}
function workbenchHome() { return "workbench/staff"; }
let theme = document.documentElement.dataset.theme || "dark";
let xray = false;
function setTheme(t) { theme = t; document.documentElement.dataset.theme = t; try { localStorage.setItem("str-theme", t); } catch (e) {} syncThemeBtn(); (window.__maps || []).forEach((h) => { try { h.swap(); } catch (e) {} }); }

function chip(txt, cls) { return '<span class="chip ' + cls + '">' + txt + "</span>"; }

/* ── maps: Leaflet (vendored locally, no API key) + lazy parcel cells ──
   Parcels/violations load per viewport from geo-cells/ as you pan; cells
   that leave the view (+margin) unload. Tiles: CARTO basemaps (keyless),
   dark_all / light_all following the theme. */
const GEO_CELL = 0.05;
let _leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (!_leafletP) {
    _leafletP = new Promise((resolve, reject) => {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "vendor/leaflet.css";
      css.onerror = () => reject(new Error("leaflet css failed"));
      document.head.appendChild(css);
      const s = document.createElement("script");
      s.src = "vendor/leaflet.js";
      s.onload = () => resolve(window.L);
      s.onerror = () => reject(new Error("leaflet js failed"));
      document.head.appendChild(s);
    });
  }
  return _leafletP;
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmtNum(n) { return Number(n).toLocaleString("en-US"); }
async function fetchCell(k) {
  if (window.__GEOCELLS && window.__GEOCELLS[k]) return window.__GEOCELLS[k];
  const r = await fetch("geo-cells/cell_" + k + ".json");
  return r.ok ? await r.json() : { p: [], v: [] };
}
async function fetchFlags() {
  if (window.__FLAGS) return window.__FLAGS;
  const r = await fetch("geo-cells/str-flags.json");
  return await r.json();
}
async function fetchPackets() {
  if (window.__PKTS) return window.__PKTS;
  const r = await fetch("geo-cells/evidence-packets.json");
  return await r.json();
}
function pktDetail(p) {
  const d = p.detail || {};
  if (p.kind === "listing_observation") return d.beds_seen + " br · $" + d.rate_seen + " · " + d.url_hash;
  if (p.kind === "booking_window") return d.window + " · " + d.nights + " nights · " + d.note;
  if (p.kind === "field_sighting") return d.seen + " · " + d.officer;
  if (p.kind === "owner_record") return d.owner;
  return "";
}
function pktCite(p) {
  if (!p.cites || !p.cites.length) return "";
  const code = p.cites[0].toLowerCase().replace(/-\d+$/, "");
  return ' · cites <a href="#/code/' + code + '">' + p.cites[0] + "</a>";
}
function tileUrl() {
  return theme === "light"
    ? "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"
    : "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
}
function flagColor(f) {
  if (f.lic === "none" || f.lic === "expired") return "#e06565";
  if (f.match === "MARGINAL") return "#e8b93e";
  return "#43c465";
}
function flagIcon(L, color) {
  return L.divIcon({ className: "", html: '<div style="width:13px;height:13px;border-radius:50%;background:' + color + ";box-shadow:0 0 7px " + color + ';border:2px solid rgba(255,255,255,.9);"></div>', iconSize: [13, 13] });
}
function licReg(l) { return l === "active" ? "ACTIVE" : l === "pending" ? "PENDING" : l === "expired" ? "EXPIRED" : "NONE"; }

function initParcelMap(elId, opts) {
  opts = opts || {};
  const statusEl = document.getElementById(elId + "-status");
  const say = (m) => { if (statusEl) statusEl.textContent = m; };
  say("loading map…");
  return loadLeaflet().then((L) => {
    const map = L.map(elId, { scrollWheelZoom: true }).setView(opts.center || [36.1627, -86.7816], opts.zoom || 11);
    const tiles = L.tileLayer(tileUrl(), { maxZoom: 19, attribution: "© OpenStreetMap contributors · Tiles © Esri" }).addTo(map);
    const parcels = L.layerGroup().addTo(map);
    const viols = L.layerGroup().addTo(map);
    const flagLayer = L.layerGroup().addTo(map);
    L.control.layers(null, { Parcels: parcels, Violations: viols, "STR flags": flagLayer }, { collapsed: false }).addTo(map);
    const cache = {}, live = {}, counts = {};
    let np = 0, nv = 0, nf = 0, seq = 0;
    const tally = () => say(fmtNum(np) + " parcels · " + fmtNum(nv) + " violations · " + nf + " STR flags — parcels load per viewport");
    function unloadFar(b) {
      Object.keys(live).forEach((k) => {
        const parts = k.split("_");
        const cLat = (parseFloat(parts[0]) + 0.5) * GEO_CELL, cLng = (parseFloat(parts[1]) + 0.5) * GEO_CELL;
        if (cLat < b.getSouth() - 0.08 || cLat > b.getNorth() + 0.08 || cLng < b.getWest() - 0.08 || cLng > b.getEast() + 0.08) {
          parcels.removeLayer(live[k].p); viols.removeLayer(live[k].v);
          np -= counts[k][0]; nv -= counts[k][1];
          delete live[k]; delete counts[k];
        }
      });
    }
    function update() {
      const my = ++seq;
      const b = map.getBounds(), z = map.getZoom();
      unloadFar(b);
      if (z < 12) { say("zoom in to load parcels · " + nf + " STR flags shown"); return; }
      const keys = [];
      for (let la = Math.floor(b.getSouth() / GEO_CELL); la <= Math.floor(b.getNorth() / GEO_CELL); la++)
        for (let ln = Math.floor(b.getWest() / GEO_CELL); ln <= Math.floor(b.getEast() / GEO_CELL); ln++)
          keys.push(la + "_" + ln);
      if (keys.length > 24) { say("zoom in to load parcels · " + nf + " STR flags shown"); return; }
      say("loading parcels…");
      (async () => {
        for (const k of keys) {
          if (my !== seq) return;
          if (live[k]) continue;
          let d = cache[k];
          if (!d) {
            try {
              d = await fetchCell(k);
              cache[k] = d;
            } catch (e) { if (my === seq) say("parcel layer unreachable — showing STR flags"); return; }
          }
          if (my !== seq || live[k]) continue;
          const gp = L.layerGroup(), gv = L.layerGroup();
          let cp = 0, cv = 0;
          d.p.forEach((p) => { cp++; gp.addLayer(L.circleMarker([p[1], p[0]], { radius: p[2] >= 3 ? 5 : 3.5, color: "#e5a83b", weight: 1, opacity: 0.85, fillOpacity: p[2] >= 3 ? 0.75 : 0.5 }).bindPopup("<b>" + esc(p[3]) + "</b><br>" + p[2] + " eviction filings<br><span style='color:#888'>" + esc(p[4] || "owner unknown") + "</span>")); });
          d.v.forEach((v) => { cv++; gv.addLayer(L.circleMarker([v[1], v[0]], { radius: 3, color: v[2] === "OPEN" ? "#e8863e" : "#8f99ab", weight: 1, opacity: 0.85, fillOpacity: 0.65 }).bindPopup("<b>" + esc(v[4]) + "</b><br>" + esc(v[3]) + "<br>" + esc(v[2]))); });
          np += cp; nv += cv; counts[k] = [cp, cv];
          gp.addTo(parcels); gv.addTo(viols);
          live[k] = { p: gp, v: gv };
        }
        if (my === seq) tally();
      })();
    }
  fetchFlags().then((flags) => fetchPackets().then((pkts) => ({ flags, pkts }))).then(({ flags, pkts }) => {
      nf = flags.filter((f) => f.lat != null).length;
      const flagByIdx = [];
      flags.forEach((f, i) => {
        if (f.lat == null) return;
        flagByIdx[i] = L.marker([f.lat, f.lng], { icon: flagIcon(L, flagColor(f)) })
          .bindPopup("<b>" + esc(f.addr) + "</b><br>" + esc(f.platform) + " · " + f.beds + " br · $" + f.rate + "<br>match " + f.match + " · license " + f.lic + "<br>" + esc(f.flag) + "<br><a href='#/parcel/" + i + "'>Open profile →</a>")
          .addTo(flagLayer);
      });
      tally();
      if (opts.tableBody) buildFlagRows(L, map, flagByIdx, flags, opts.tableBody);
    }).catch(() => say("flag layer failed to load"));
    map.on("moveend zoomend", update);
    setTimeout(() => { try { map.invalidateSize(); } catch (e) {} update(); }, 60);
    const handle = { map, swap() { try { tiles.setUrl(tileUrl()); } catch (e) {} } };
    (window.__maps = window.__maps || []).push(handle);
    return handle;
  }).catch(() => say("map failed to load (leaflet unreachable)"));
}

/* ── paged lists: one component for queues everywhere ──
   mountPaged(id, {cols, rows, cards, per, view, bind}) renders a table
   (or cards) with prev/next + a cards/table toggle into #id / #id-ctrl.
   bind(view, offset) re-attaches row behavior after every redraw. */
const PAGERS = {};
function mountPaged(id, cfg) {
  PAGERS[id] = Object.assign({ page: 0, per: 5, view: "table" }, cfg);
  drawPaged(id);
}
function drawPaged(id) {
  const st = PAGERS[id];
  const view = document.getElementById(id);
  const ctrl = document.getElementById(id + "-ctrl");
  if (!st || !view) return;
  const pages = Math.max(1, Math.ceil(st.rows.length / st.per));
  st.page = Math.max(0, Math.min(st.page, pages - 1));
  const a = st.page * st.per;
  if (st.view === "cards" && st.cards) view.innerHTML = st.cards.slice(a, a + st.per).join("");
  else view.innerHTML = '<table class="grid"><thead><tr>' + st.cols.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" + st.rows.slice(a, a + st.per).map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  if (ctrl) {
    ctrl.innerHTML = '<button class="btn" data-pg="-1"' + (st.page === 0 ? " disabled" : "") + ">← Prev</button>" +
      "<span style='font-size:12px;color:var(--dim);margin:0 8px;'>Page " + (st.page + 1) + " of " + pages + " · " + st.rows.length + " items</span>" +
      '<button class="btn" data-pg="1"' + (st.page >= pages - 1 ? " disabled" : "") + ">Next →</button>" +
      (st.cards ? ' <button class="btn" data-vw="1">' + (st.view === "table" ? "Cards view" : "Table view") + "</button>" : "");
    ctrl.querySelectorAll("[data-pg]").forEach((b) => { b.onclick = () => { st.page += parseInt(b.dataset.pg, 10); drawPaged(id); }; });
    const vw = ctrl.querySelector("[data-vw]");
    if (vw) vw.onclick = () => { st.view = st.view === "table" ? "cards" : "table"; drawPaged(id); };
  }
  if (st.bind) st.bind(view, a);
}
/* staff-home queue, hydrated live from the flag feed: unregistered +
   lapsed + marginal — the actionable subset, newest risk first. */
function hydrateLanes() {
  const here = location.hash;
  fetchFlags().then((flags) => {
    if (location.hash !== here || !document.getElementById("lane-act")) return;
    const act = [], ver = [], wat = [];
    flags.forEach((f, i) => {
      if (f.match === "MARGINAL") ver.push({ f, i });
      else if (f.lic === "none" || f.lic === "expired") act.push({ f, i });
      else if (f.lic === "pending") wat.push({ f, i });
    });
    const item = (r, btn) => '<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;"><b>' + esc(r.f.addr) + "</b><br><span style='font-size:11.5px;color:var(--dim);'>" + matchChip(r.f.match) + " " + regChip(licReg(r.f.lic)) + " · " + esc(r.f.platform) + " · $" + r.f.rate + "</span> " + btn + "</div>";
    const fill = (id, list, btn, all) => {
      const el = document.getElementById(id);
      const n = document.getElementById(id + "-n");
      if (n) n.innerHTML = ' <span class="chip warn">' + list.length + "</span>";
      if (el) el.innerHTML = (list.length ? list.slice(0, 3).map((r) => item(r, btn(r))).join("") : "<p>Nothing here.</p>") + (list.length > 3 ? "<p style='font-size:11.5px;color:var(--dim);margin:6px 0 0;'>+" + (list.length - 3) + " more — " + all + "</p>" : "");
    };
    fill("lane-act", act, (r) => '<a href="#/parcel/' + r.i + '">Open →</a>', '<a href="#/oversee/detection">view all</a>');
    fill("lane-verify", ver, (r) => '<a href="#/workbench/staff/verify">Verify →</a>', '<a href="#/workbench/staff/verify">verify queue</a>');
    fill("lane-watch", wat, (r) => '<a href="#/parcel/' + r.i + '">Open →</a>', '<a href="#/oversee/map-table">monitor</a>');
  }).catch(() => {
    ["lane-act", "lane-verify", "lane-watch"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = "<p>Queue failed to load.</p>";
    });
  });
}

function buildFlagRows(L, map, flagByIdx, flags, bodyId) {
  const host = document.getElementById(bodyId);
  if (!host) return;
  const rows = flags.map((f) => [esc(f.addr), matchChip(f.match), regChip(licReg(f.lic))]);
  mountPaged(bodyId, {
    cols: ["Address " + X("TransformerAssetMapper → Asset"), "Match " + X("Azora · unmeasured"), "Reg " + X("BB · Asset.licenses.status")], rows, per: 8, view: "table",
    bind(view, a) {
      view.querySelectorAll("tbody tr").forEach((tr, j) => {
        const i = a + j;
        tr.dataset.gi = i;
        tr.style.cursor = "pointer";
        tr.onclick = () => { location.hash = "#/parcel/" + i; };
      });
    }
  });
  Object.keys(flagByIdx).forEach((k) => {
    flagByIdx[k].on("click", () => {
      const st = PAGERS[bodyId];
      if (st) { st.page = Math.floor(Number(k) / st.per); drawPaged(bodyId); }
      const h = document.getElementById(bodyId);
      const tr = h && h.querySelector('tr[data-gi="' + k + '"]');
      if (tr) { tr.classList.add("hl"); tr.scrollIntoView({ block: "nearest" }); }
    });
  });
}

/* ── full compliance calendar: month grid + day agenda over CAL_RECORDS ── */
let calMonth = null, calSelectedDay = null, calKindFilter = "all";
function pCalendar() {
  if (!calMonth) { const t = calEpochDayToDate(calTodayEpochDay()); calMonth = { y: t.getUTCFullYear(), m: t.getUTCMonth() }; }
  const records = CAL_RECORDS.filter((r) => calKindFilter === "all" || r.kind === calKindFilter);
  const first = calEpochDayUTC(calMonth.y, calMonth.m, 1);
  const startDow = calEpochDayToDate(first).getUTCDay();
  const daysInMonth = new Date(Date.UTC(calMonth.y, calMonth.m + 1, 0)).getUTCDate();
  const today = calTodayEpochDay();
  const byDay = new Map();
  records.forEach((r) => { if (!byDay.has(r.dateEpochDay)) byDay.set(r.dateEpochDay, []); byDay.get(r.dateEpochDay).push(r); });
  const monthLabel = calEpochDayToDate(first).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ed = first + (d - 1);
    const dayRecords = byDay.get(ed) || [];
    const shown = dayRecords.slice(0, 2);
    cells += '<div class="cal-cell ' + (ed === today ? "today" : "") + " " + (ed === calSelectedDay ? "selected" : "") + '" data-cal-day="' + ed + '">' +
      '<div class="cal-daynum">' + d + "</div>" +
      shown.map((r) => '<div class="cal-chip cal-' + r.status + '">' + r.kind + "</div>").join("") +
      (dayRecords.length > shown.length ? '<div style="font-size:8.5px;color:var(--faint);">+' + (dayRecords.length - shown.length) + "</div>" : "") + "</div>";
  }
  if (calSelectedDay === null || !byDay.has(calSelectedDay)) {
    const upcoming = records.filter((r) => r.dateEpochDay >= today).sort((a, b) => a.dateEpochDay - b.dateEpochDay);
    calSelectedDay = upcoming.length ? upcoming[0].dateEpochDay : (records[0] ? records[0].dateEpochDay : null);
  }
  const agendaRecords = (byDay.get(calSelectedDay) || []).slice().sort((a, b) => a.id - b.id);
  return crumb([["", "Home"], ["oversee/calendar", "Calendar"]]) +
    "<h1>Compliance calendar</h1>" +
    '<p class="lede">' + fmtNum(records.length) + " dummy records over " + CAL_ADDRS.length + " addresses — inspections, notices, renewals, tax audits. Same idea as " + link("oversee/inspect", "the 7-day inspection view") + ", zoomed out to a month.</p>" +
    '<div class="cal-toolbar">' +
    '<button class="btn sm" id="cal-prev">‹ prev</button><span class="cal-month-label">' + monthLabel + "</span><button class=\"btn sm\" id=\"cal-next\">next ›</button><button class=\"btn sm\" id=\"cal-today\">today</button>" +
    ["all", ...CAL_KINDS].map((k) => '<button class="cal-fchip ' + (calKindFilter === k ? "on" : "") + '" data-cal-kind="' + k + '">' + k + "</button>").join("") + "</div>" +
    '<div class="cal-body"><div><div class="cal-grid">' + DOW.map((d) => '<div class="cal-dow">' + d + "</div>").join("") + cells + "</div></div>" +
    '<div class="cal-agenda"><h4>' + (calSelectedDay !== null ? calEpochDayToDate(calSelectedDay).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "UTC" }) : "no records") + "</h4>" +
    (agendaRecords.length ? agendaRecords.map((r) => '<div class="cal-record"><div class="cal-record-kind">' + r.kind + " " + chip(r.status, r.status === "completed" ? "ok" : r.status === "overdue" ? "bad" : "warn") + '</div><div class="cal-record-note">' + r.note + "</div><div>" + calAddrLink(r.addr) + "</div></div>").join("") : '<p class="src-link">Nothing scheduled this day.</p>') +
    "</div></div>" +
    pager(["oversee/inspect", "Back: inspections"], ["data/bridge", "Next: evidence"]);
}

/* ── parcel profile: one flagged parcel, fully evidenced ── */
function pParcel(idx) {
  return crumb([["", "Home"], ["oversee/map-table", "Map + table"], ["parcel/" + idx, "Parcel"]]) +
    '<div id="parcel-body"><p class="lede">loading parcel…</p></div>' +
    pager(["oversee/map-table", "Back: map + table"], null);
}
function hydrateParcel(idx) {
  const want = "#/parcel/" + idx;
  fetchFlags().then((flags) => {
    if (location.hash.replace(/^#\/?/, "") !== "parcel/" + idx) return;
    const el = document.getElementById("parcel-body");
    if (!el) return;
    const f = flags[Number(idx)];
    if (!f) { el.innerHTML = "<h1>Not found</h1>" + '<p class="lede">No flag at index ' + esc(idx) + ".</p>"; return; }
    const where = f.lat != null
      ? f.lat.toFixed(5) + ", " + f.lng.toFixed(5)
      : "no parcel link — unlocated, held out of notices";
    const action = (f.lic === "none" || f.lic === "expired")
      ? '<a class="btn primary" href="#/workbench/staff">Open case</a>'
      : (f.match === "MARGINAL" ? '<a class="btn" href="#/workbench/staff/verify">Verify</a>' : "");
    const mine = (pkts || []).filter((p) => p.addr === f.addr);
    const evCard = mine.length ? '<div class="card"><h3>Evidence packets (' + mine.length + ")</h3>" + grid(["Packet", "Kind", "Captured", "Detail", "Status"],
      mine.map((p) => [p.id, p.kind.replace(/_/g, " "), esc(p.captured) + "<br>" + esc(p.source), "<span style='font-size:11.5px'>" + esc(pktDetail(p)) + pktCite(p) + "</span>", p.status === "held" ? chip("HELD", "warn") : chip("ATTACHED", "ok")])) + "<p>Held packets stay out of notices until their match clears.</p></div>" : "";
    el.innerHTML = "<h1>" + esc(f.addr) + "</h1>" +
      '<p class="lede">' + matchChip(f.match) + " · license " + regChip(licReg(f.lic)) + " · " + esc(f.flag) + "</p>" +
      '<div class="card"><h3>Listing (observed)</h3>' + grid(["Platform", "Bedrooms", "Nightly rate", "Match"],
        [[esc(f.platform), f.beds, "$" + f.rate, matchChip(f.match)]]) + "</div>" +
      '<div class="card"><h3>Parcel (record)</h3>' + grid(["Owner", "Eviction filings", "First filed", "Last filed", "Location"],
        [[esc(f.landlord || "unknown"), f.evictions != null ? f.evictions : "—", esc(f.first_file || "—"), esc(f.last_file || "—"), esc(where)]]) + "</div>" + evCard +
      (action ? '<div class="card"><h3>Next action</h3>' + action + "</div>" : "");
  }).catch(() => {
    const el = document.getElementById("parcel-body");
    if (el) el.innerHTML = "<p>Flag data failed to load.</p>";
  });
}

function buildNav() {
  document.getElementById("topnav").innerHTML = TOPS[persona].map((t) => '<a href="#/' + t[0] + '"' + (t[0].startsWith("workbench") ? ' id="top-wb"' : "") + ' data-top="' + t[0] + '">' + t[1] + "</a>").join("") +
    (persona === "staff" ? '<a href="btora/paths-overview.html" data-top="paths">Delivery × folds</a><a href="municipal-db.html" data-top="municipal-db">Municipal DB ↗</a>' : "");
}

function render() {
  (window.__maps || []).forEach((h) => { try { h.map.remove(); } catch (e) {} });
  window.__maps = [];
  buildNav();
  syncThemeBtn();
  const themeBtn = document.getElementById("theme-btn");
  if (themeBtn) themeBtn.onclick = () => setTheme(theme === "light" ? "dark" : "light");
  const xb = document.getElementById("xray-btn");
  if (xb) { xb.classList.toggle("on", xray); xb.onclick = () => { xray = !xray; document.body.classList.toggle("xray", xray); xb.classList.toggle("on", xray); toast(xray ? "X-ray on — field sources shown." : "X-ray off."); }; }
  const route = location.hash.replace(/^#\/?/, "");
  const pm = route.match(/^parcel\/(\d+)$/);
  let fn = ROUTES[route] || (pm ? () => pParcel(pm[1]) : null);
  if (!allowed(route)) fn = () => pGate(route);
  fn = fn || (() => p404(route));
  document.getElementById("app").innerHTML = fn() + '<footer>Metro Nashville-Davidson County · STR compliance</footer>';
  const topFor = route === "" ? "" : TOPS[persona].map((t) => t[0]).filter((t) => t && (route === t || route.startsWith(t.split("/")[0] + "/"))).sort((a, b) => b.length - a.length)[0] || "";
  document.querySelectorAll("#topnav a").forEach((a) => a.classList.toggle("active", a.dataset.top === (route === "" ? "" : topFor)));
  const wb = document.getElementById("top-wb");
  if (wb) { wb.href = "#/" + workbenchHome(); wb.classList.toggle("active", route.startsWith("workbench/")); }
  document.querySelectorAll("#pseg button").forEach((b) => { b.classList.toggle("on", b.dataset.p === persona); b.onclick = () => setPersona(b.dataset.p); });
  bindActions();
  if (document.getElementById("home-map")) { try { initParcelMap("home-map"); } catch (e) { console.warn("[demo] home map failed:", e); } }
  if (document.getElementById("geo-map")) { try { initParcelMap("geo-map"); } catch (e) { console.warn("[demo] geo map failed:", e); } }
  if (document.getElementById("lane-act")) { try { hydrateLanes(); } catch (e) { console.warn("[demo] lanes failed:", e); } }
  if (document.getElementById("mt-map")) { try { initParcelMap("mt-map", { tableBody: "mt-rows", zoom: 12 }); } catch (e) { console.warn("[demo] map-table failed:", e); } }
  const pmm = route.match(/^parcel\/(\d+)$/);
  if (pmm && document.getElementById("parcel-body")) { try { hydrateParcel(pmm[1]); } catch (e) { console.warn("[demo] parcel failed:", e); } }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();
