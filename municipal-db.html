<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>municipal registry — matrix-events workbench</title>
<style>
:root{
  /* copied from the real app's own root block (bare-metal-eo-matrix-app/index.html) */
  --bg:#fafaf7; --surface:#fff; --surface-2:#f4f3ee; --surface-3:#ebe9e2;
  --border:#c9c6bd; --border-strong:#7a766c; --border-bright:#444;
  --text:#1a1a17; --text-dim:#5a574e; --text-bright:#000; --text-faint:#8e8a7d;
  --triad-existence:#0e7a52;     /* NUL SIG INS · ∅ ○ ● */
  --triad-structure:#4731a8;     /* SEG CON SYN · ｜ ⤫ △ */
  --triad-significance:#a91d1d;  /* DEF EVA REC · ⊢ ⊨ ⊛ */
  --signal:#8a6300;
  --green:var(--triad-existence); --blue:var(--triad-structure); --red:var(--triad-significance); --yellow:var(--signal);
  --mono: ui-monospace,'SF Mono','Menlo','Monaco','Consolas','Liberation Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--mono);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font:inherit;color:inherit;background:#fff;border:1px solid var(--border);border-radius:0;padding:5px 8px;outline:none;font-size:12.5px;}
input:focus,textarea:focus,select:focus{border-color:#000;box-shadow:inset 0 0 0 1px #000;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#ddd;border:2px solid #fff;} ::-webkit-scrollbar-thumb:hover{background:#888;}

.shell{display:grid;grid-template-rows:auto 1fr;height:100vh;background:var(--bg);}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border-strong);background:#fff;flex-shrink:0;}
.topbar .brand{font-weight:700;font-size:13px;letter-spacing:.2px;}
.topbar .stats{margin-left:auto;display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);}
.topbar .stats b{color:var(--text-bright);}
.topbar .stats .bad{color:var(--red);font-weight:700;}
.topbar .stats .ok{color:var(--green);font-weight:700;}

.shell-body{display:grid;grid-template-columns:236px 1fr;min-height:0;overflow:hidden;}

.sidebar{display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--border-strong);overflow-y:auto;font-size:12.5px;}
.sb-room-head{padding:13px 14px;border-bottom:1px solid var(--border-strong);background:#fff;}
.sb-room-name{font-size:14px;color:var(--text-bright);font-weight:700;letter-spacing:.2px;text-transform:lowercase;line-height:1.2;}
.sb-room-sub{font-size:11px;color:var(--text-dim);margin-top:4px;}
.sb-section{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--border);}
.sb-section-head{padding:4px 14px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:700;}
.sb-table-head{display:flex;align-items:stretch;border-left:3px solid transparent;}
.sb-table-head:hover{background:#fff;}
.sb-table-head.active{background:#fff;border-left-color:#000;}
.sb-table-link{flex:1;display:flex;align-items:center;gap:7px;padding:5px 14px 5px 11px;background:transparent;border:none;color:var(--text);cursor:pointer;font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:left;width:100%;}
.sb-table-head.active .sb-table-link{color:var(--text-bright);font-weight:700;}
.sb-table-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-table-count{font-size:10.5px;color:var(--text-dim);padding:0 6px;border:1px solid var(--border);background:#fff;font-weight:500;font-variant-numeric:tabular-nums;}
.sb-log-link{display:flex;align-items:center;gap:8px;padding:7px 14px;background:transparent;border:none;border-left:3px solid transparent;color:var(--text);cursor:pointer;font-family:var(--mono);font-size:12.5px;text-align:left;width:100%;font-weight:600;}
.sb-log-link:hover{background:#fff;}
.sb-log-link.active{background:#fff;border-left-color:#000;color:var(--text-bright);}
.sb-reset{margin:8px 14px 4px;padding:5px 8px;background:#fff;border:1px dashed var(--border-strong);color:var(--text-dim);font-family:var(--mono);font-size:11px;text-align:left;cursor:pointer;}
.sb-reset:hover{border-color:var(--red);color:var(--red);border-style:solid;}
.sb-storage{padding:8px 14px;font-size:10.5px;color:var(--text-faint);line-height:1.5;}

.main{overflow:auto;min-height:0;display:flex;flex-direction:column;}
.tv-head{padding:13px 18px;border-bottom:1px solid var(--border-strong);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--surface);flex-shrink:0;}
.tv-head h2{font-weight:700;font-size:16px;color:var(--text-bright);letter-spacing:.2px;text-transform:lowercase;}
.tv-head .crumb{font-size:12px;color:var(--text-dim);font-weight:500;}
.tv-body{padding:0;flex:1;min-height:0;overflow:auto;}
.tv-body.pad{padding:18px;max-width:640px;}
.tv-tabs{display:flex;gap:0;padding:0 18px;border-bottom:1px solid var(--border-strong);background:var(--surface-2);flex-shrink:0;}
.tv-tab{display:flex;align-items:center;gap:7px;padding:8px 14px;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--text);font-size:12.5px;cursor:pointer;font-family:var(--mono);letter-spacing:.2px;font-weight:500;text-transform:lowercase;}
.tv-tab:hover{color:var(--text-bright);}
.tv-tab.active{border-bottom-color:#000;color:var(--text-bright);font-weight:700;background:var(--surface);}
.tv-tab.meta{color:var(--text-dim);font-style:italic;}
.tv-tab.meta.active{color:var(--text-bright);font-style:normal;}
.tv-tab .trows{font-size:10.5px;color:var(--text-dim);padding:1px 6px;border:1px solid var(--border-strong);background:#fff;font-weight:500;}

.dbtable{background:#fff;border:1px solid var(--border);margin:16px;}
.dbtable .ddl{padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);line-height:1.6;white-space:pre;overflow-x:auto;}
.dbtable .ddl .kw{color:var(--triad-significance);font-weight:600;}
.dbtable .ddl .id{color:var(--text-bright);}
.dbtable .ddl .ty{color:var(--triad-structure);}
.dbtable-scroll{overflow-x:auto;}
table.grid{border-collapse:collapse;width:100%;font-size:12px;}
table.grid th{text-align:left;padding:7px 10px;background:var(--surface-2);border-bottom:1.5px solid var(--border-strong);border-right:1px solid var(--border);color:var(--text-dim);font-weight:700;white-space:nowrap;position:sticky;top:0;}
table.grid td{padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.grid tr.row:hover{background:var(--surface-2);cursor:pointer;}
table.grid tr.row.expanded{background:var(--surface-2);}
.row-detail td{white-space:normal;background:var(--surface-2);font-size:11.5px;padding:10px 14px;}
.row-detail .anchor{color:var(--text-faint);font-size:10.5px;}
.row-detail .rel{color:var(--triad-structure);margin-top:4px;}
.row-detail .ev{margin-top:4px;padding:3px 7px;display:inline-block;border:1px solid var(--border);}
.row-detail .ev.satisfied,.row-detail .ev.confirmed,.row-detail .ev.provisionally_earned{border-color:var(--triad-existence);color:var(--triad-existence);}
.row-detail .ev.violated{border-color:var(--triad-significance);color:var(--triad-significance);}
.row-detail .ev.waived,.row-detail .ev.live_hypothesis{border-color:var(--signal);color:var(--signal);}
.row-detail .partition{color:#fff;background:var(--triad-structure);padding:1px 7px;display:inline-block;margin-top:4px;}


.timeline{font-size:12px;}
.tl-row{display:flex;gap:10px;padding:5px 16px;border-bottom:1px solid var(--surface-3);align-items:baseline;}
.tl-row:hover{background:var(--surface-2);}
.tl-row.reverted{opacity:.45;text-decoration:line-through;}
.tl-idx{color:var(--text-faint);font-size:10.5px;width:38px;flex-shrink:0;}
.tl-glyph{width:16px;flex-shrink:0;font-weight:700;text-align:center;}
.tl-glyph.existence{color:var(--triad-existence);} .tl-glyph.structure{color:var(--triad-structure);} .tl-glyph.significance{color:var(--triad-significance);}
.tl-key{width:34px;flex-shrink:0;color:var(--text-dim);font-weight:600;}
.tl-body{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-anchor{color:var(--text-faint);} .tl-path{color:var(--triad-structure);} .tl-val{color:var(--text-bright);} .tl-rel{color:var(--triad-significance);}
.tl-sender{color:var(--text-faint);font-size:10.5px;margin-left:10px;}
.tl-anchor-link{background:none;border:none;padding:0;font:inherit;color:var(--text-faint);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
.tl-anchor-link:hover{color:var(--text-bright);}
.tl-undo{margin-left:8px;font-size:10px;padding:1px 6px;border:1px solid var(--border-strong);background:#fff;color:var(--text-dim);flex-shrink:0;}
.tl-undo:hover{border-color:var(--red);color:var(--red);}
.tl-warn{margin-left:8px;font-size:10px;padding:1px 6px;border:1px solid var(--signal);background:#fff;color:var(--signal);flex-shrink:0;}

/* ── profile panel ── */
.profile-overlay{position:fixed;inset:0;z-index:300;display:none;}
.profile-overlay.open{display:block;}
.profile-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.25);}
.profile-panel{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;border-left:1px solid #000;box-shadow:-18px 0 40px -10px rgba(0,0,0,.35);display:flex;flex-direction:column;}
.profile-panel-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-strong);background:var(--surface-2);flex-shrink:0;}
.profile-back{font-size:18px;font-weight:700;padding:2px 8px;border:1px solid var(--border-strong);background:#fff;}
.profile-back:hover{border-color:#000;}
.profile-crumbs{flex:1;font-size:11.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crumb-link{background:none;border:none;padding:0;font:inherit;color:var(--triad-structure);cursor:pointer;text-decoration:underline;}
.crumb-sep{color:var(--text-faint);margin:0 2px;}
.profile-close{font-size:18px;padding:2px 9px;border:1px solid var(--border-strong);background:#fff;}
.profile-close:hover{border-color:var(--red);color:var(--red);}
.profile-panel-body{flex:1;overflow-y:auto;padding:16px;}
.profile-title{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.profile-type{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--text-dim);padding:2px 7px;font-weight:700;}
.profile-anchor{font-size:10.5px;color:var(--text-faint);margin:4px 0 12px;word-break:break-all;}
.profile-section-head{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-dim);font-weight:700;margin:16px 0 6px;border-top:1px solid var(--border);padding-top:10px;}
.profile-judgment{margin-bottom:10px;padding:8px 10px;border:1px solid var(--border);border-left-width:3px;}
.profile-judgment:last-child{margin-bottom:0;}
.profile-judgment.satisfied,.profile-judgment.confirmed,.profile-judgment.provisionally_earned{border-left-color:var(--triad-existence);}
.profile-judgment.violated{border-left-color:var(--triad-significance);}
.profile-judgment.waived,.profile-judgment.live_hypothesis{border-left-color:var(--signal);}
.profile-judgment-head{font-size:12px;font-weight:700;margin-bottom:4px;}
.profile-judgment-head .pj-result{text-transform:uppercase;font-size:10px;letter-spacing:.5px;font-weight:700;}
.profile-judgment.satisfied .pj-result,.profile-judgment.confirmed .pj-result,.profile-judgment.provisionally_earned .pj-result{color:var(--triad-existence);}
.profile-judgment.violated .pj-result{color:var(--triad-significance);}
.profile-judgment.waived .pj-result,.profile-judgment.live_hypothesis .pj-result{color:var(--signal);}
.profile-judgment-note{font-size:12px;line-height:1.5;color:var(--text-dim);}
.profile-fields{width:100%;border-collapse:collapse;font-size:12px;}
.profile-fields td{padding:4px 0;border-bottom:1px solid var(--surface-3);vertical-align:top;}
.pf-key{color:var(--text-dim);font-weight:600;width:38%;padding-right:10px;}
.pf-val{word-break:break-word;}
.field-link{color:var(--triad-structure);text-decoration:none;border-bottom:1px solid var(--triad-structure);}
.field-link:hover{color:var(--text-bright);border-bottom-color:var(--text-bright);}
.rel-group{margin-bottom:10px;}
.rel-group.unusual{border-left:2px solid var(--signal);padding-left:8px;margin-left:-10px;}
.rel-group-head{font-size:11.5px;color:var(--triad-structure);font-weight:700;margin-bottom:4px;}
.rel-group.unusual .rel-group-head{color:var(--signal);}
.rel-count{color:var(--text-faint);font-weight:500;}
.rel-row{padding:5px 0 5px 10px;border-bottom:1px solid var(--surface-3);}
.rel-row:last-child{border-bottom:none;}
.rel-type-tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:0 4px;margin-right:6px;font-weight:700;vertical-align:1px;}
.rel-more{padding-left:10px;margin-top:2px;}
.rel-more summary{cursor:pointer;display:inline-block;font-size:10.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;list-style:none;font-weight:600;}
.rel-more summary::-webkit-details-marker{display:none;}
.rel-more summary:hover{color:var(--text-bright);border-color:var(--border-strong);}
.rel-more[open] summary{margin-bottom:2px;}
.rel-more .rel-row:first-of-type{border-top:1px solid var(--surface-3);}
.anchor-link{display:inline-block;background:none;border:none;padding:0;font:inherit;font-size:12.5px;line-height:1.45;color:var(--text-bright);cursor:pointer;text-align:left;text-decoration:none;border-bottom:1px solid transparent;}
.anchor-link:hover{border-bottom-color:var(--triad-structure);color:var(--triad-structure);}
.anchor-link:hover{color:var(--triad-structure);text-decoration-color:var(--triad-structure);}
.profile-undo-btn{margin-top:6px;font-size:10.5px;padding:3px 9px;border:1px solid var(--border-strong);background:#fff;color:var(--text-dim);}
.profile-undo-btn:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <span class="brand">municipal registry</span>
    <span class="stats" id="stats"></span>
  </div>
  <div class="shell-body">
    <div class="sidebar">
      <div class="sb-room-head">
        <div class="sb-room-name">str registry · 5 cities</div>
        <div class="sb-room-sub">event-sourced · real fold.js/operators.js</div>
      </div>
      <div class="sb-section">
        <div class="sb-section-head">tables</div>
        <div id="sb-tables"></div>
      </div>
      <div class="sb-section" style="border-bottom:none;">
        <button class="sb-log-link" id="sb-log">≡ event log (raw timeline)</button>
        <button class="sb-log-link" id="sb-trash">🗑 recycle bin</button>
        <button class="sb-reset" id="reset-btn">reset to seed corpus</button>
        <div class="sb-storage" id="storage-status">loading…</div>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="profile-overlay" id="profile-overlay">
  <div class="profile-backdrop" id="profile-backdrop"></div>
  <div class="profile-panel">
    <div class="profile-panel-head">
      <button class="profile-back" id="profile-back" title="back">‹</button>
      <div class="profile-crumbs" id="profile-crumbs"></div>
      <button class="profile-close" id="profile-close" title="close">×</button>
    </div>
    <div class="profile-panel-body" id="profile-body"></div>
  </div>
</div>

<script type="module">
/* ── real engine, verbatim (bar one import redirect + buildSeg/buildSyn added) ── */
// real-operators-pure.js
//
// VERBATIM from clovenbradshaw-ctrl/bare-metal-eo-matrix-app
// commit 95ddd6beaa1c83359822de174416a3f94ebb7ed9, src/operators.js.
//
// This file contains ONLY the parts of the real operators.js that have no
// Matrix-client coupling: the OP table, eventType()/parseEventType(), the
// cyrb53 content-address hash, and NS. The real emit()/ins()/con()/def()/
// eva()/rec() wrappers are NOT reproduced here — they call getClient()
// (src/client.js) and enqueue() (src/outbox.js), which require a live,
// authenticated browser session against a Matrix homeserver and cannot run
// in this sandbox (confirmed: `import('./src/fold.js')` in plain Node fails
// with "window is not defined", coming from client.js's own top-level code).
//
// What IS reproduced below is byte-identical to the real file: the OP table,
// eventType, parseEventType, and cyrb53 are copied verbatim, unchanged.

let NS = 'io.matrix-events';
function setNamespace(namespace) { NS = namespace; }
function getNamespace() { return NS; }

function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

const OP = {
  NUL: { key: 'nul', glyph: '∅', triad: 'existence',    order: 0, stored: false },
  SIG: { key: 'sig', glyph: '○', triad: 'existence',    order: 1, stored: false },
  INS: { key: 'ins', glyph: '●', triad: 'existence',    order: 2, stored: true  },
  SEG: { key: 'seg', glyph: '｜', triad: 'structure',    order: 3, stored: true  },
  CON: { key: 'con', glyph: '⤫', triad: 'structure',    order: 4, stored: true  },
  SYN: { key: 'syn', glyph: '△', triad: 'structure',    order: 5, stored: true  },
  DEF: { key: 'def', glyph: '⊢', triad: 'significance', order: 6, stored: true  },
  EVA: { key: 'eva', glyph: '⊨', triad: 'significance', order: 7, stored: true  },
  REC: { key: 'rec', glyph: '⊛', triad: 'significance', order: 8, stored: true  },
};

function eventType(op) {
  return `${NS}.${op.key}`;
}

function parseEventType(type) {
  if (typeof type !== 'string') return null;
  if (!type.startsWith(NS + '.')) return null;
  const suffix = type.slice(NS.length + 1);
  return Object.values(OP).find(op => op.key === suffix) || null;
}

function buildIns(entityType, payload, { sender, ts }) {
  const input = `${entityType}\0${JSON.stringify(payload)}\0${sender}\0${ts}`;
  const hash = cyrb53(input);
  const anchor = `${entityType}_${hash.toString(16)}`;
  return {
    type: eventType(OP.INS),
    content: { anchor, entity_type: entityType, payload },
    origin_server_ts: ts,
    sender,
    event_id: `$${entityType}_${hash.toString(16)}`,
    anchor,
  };
}

function buildDef(anchor, path, value, { sender, ts, id }) {
  return {
    type: eventType(OP.DEF),
    content: { anchor, path, value },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

function buildCon(sourceAnchor, targetAnchor, relationType, { sender, ts, id }) {
  return {
    type: eventType(OP.CON),
    content: { source_anchor: sourceAnchor, target_anchor: targetAnchor, relation_type: relationType },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

function buildEva(anchor, criterion, result, note, { sender, ts, id }) {
  return {
    type: eventType(OP.EVA),
    content: { anchor, criterion, result, note },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

function buildRec(scope, beforeFrame, afterFrame, { sender, ts, id }) {
  return {
    type: eventType(OP.REC),
    content: { scope, before_frame: beforeFrame, after_frame: afterFrame },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

function buildSeg(anchor, partition, { sender, ts, id }) {
  return {
    type: eventType(OP.SEG),
    content: { anchor, partition },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

function buildSyn(inputAnchors, output, { sender, ts, id }) {
  return {
    type: eventType(OP.SYN),
    content: { input_anchors: inputAnchors, output },
    origin_server_ts: ts,
    sender,
    event_id: id,
  };
}

/**
 * fold.js — The integral fold
 *
 * State is never stored. It is always derived by folding the event stream.
 * The fold is permissive: it processes whatever the log contains.
 * Violations are flagged in state._violations, never blocked.
 */

function initial() {
  return {
    entities: {},
    partitions: {},
    connections: [],
    frames: [],
    schema: {},
    cursor: 0,
    _undecryptable: 0,
    _violations: [],
  };
}

function setPath(obj, path, value) {
  const parts = path.split('.');
  let current = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!(parts[i] in current) || typeof current[parts[i]] !== 'object') {
      current[parts[i]] = {};
    }
    current = current[parts[i]];
  }
  current[parts[parts.length - 1]] = value;
}

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => o?.[k], obj);
}

function cyrb53Fold(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

/**
 * Dispatch a single event into the accumulator. Mutates state in place.
 *
 * The `_deleted` flag (added for this workbench's recycle-bin feature, not
 * part of the real operators.js) makes a dispatched event a no-op here
 * without removing it from EVENTS — undo/restore just flips the flag and
 * re-folds from scratch, since fold() is a pure function of the event list.
 */
function dispatch(state, event) {
  if (event._deleted) return state;

  const type = typeof event.getType === 'function' ? event.getType() : event.type;
  const content = typeof event.getContent === 'function' ? event.getContent() : event.content;
  const ts = typeof event.getTs === 'function' ? event.getTs() : event.origin_server_ts || 0;
  const sender = typeof event.getSender === 'function' ? event.getSender() : event.sender;
  const eventId = typeof event.getId === 'function' ? event.getId() : event.event_id || null;

  if (type === 'm.room.encrypted') {
    state._undecryptable++;
    return state;
  }

  if (!content || Object.keys(content).length === 0) return state;

  const op = parseEventType(type);
  if (!op) return state;

  state.cursor = ts;

  switch (op) {
    case OP.INS: {
      const { anchor, entity_type, payload } = content;
      if (!anchor) break;
      state.entities[anchor] = {
        ...payload,
        _anchor: anchor,
        _type: entity_type,
        _created: ts,
        _sender: sender,
        _eventId: eventId,
        _hwm: OP.INS.order,
      };
      break;
    }

    case OP.SEG: {
      const { anchor, partition } = content;
      if (!anchor) break;
      const entity = state.entities[anchor];
      if (!entity) {
        state._violations.push({ type: 'missing_ins', op: 'SEG', anchor, _ts: ts, _eventId: eventId });
        break;
      }
      state.partitions[anchor] = partition;
      entity._partition = partition;
      entity._updated = ts;
      if (OP.SEG.order > entity._hwm) entity._hwm = OP.SEG.order;
      break;
    }

    case OP.CON: {
      const { source_anchor, target_anchor, relation_type } = content;

      const srcMissing = !state.entities[source_anchor];
      const tgtMissing = !state.entities[target_anchor];
      if (srcMissing || tgtMissing) {
        state._violations.push({
          type: 'cartesian_product', op: 'CON',
          source: source_anchor, target: target_anchor,
          missing: srcMissing && tgtMissing ? 'both' : srcMissing ? 'source' : 'target',
          _ts: ts, _eventId: eventId,
        });
      }

      state.connections.push({
        source: source_anchor,
        target: target_anchor,
        type: relation_type,
        _ts: ts,
        _sender: sender,
        _eventId: eventId,
      });

      const src = state.entities[source_anchor];
      const tgt = state.entities[target_anchor];
      if (src && OP.CON.order > src._hwm) src._hwm = OP.CON.order;
      if (tgt && OP.CON.order > tgt._hwm) tgt._hwm = OP.CON.order;
      break;
    }

    case OP.SYN: {
      const { input_anchors, output } = content;
      const synAnchor = eventId ? `syn_${eventId}` : `syn_${ts}_${sender || 'anon'}`;

      if (input_anchors) {
        for (const ia of input_anchors) {
          if (!state.entities[ia]) {
            state._violations.push({ type: 'missing_ins', op: 'SYN', anchor: ia, _ts: ts, _eventId: eventId });
          }
        }
      }

      state.entities[synAnchor] = {
        ...output,
        _anchor: synAnchor,
        _type: '_synthesis',
        _inputs: input_anchors,
        _created: ts,
        _sender: sender,
        _eventId: eventId,
        _hwm: OP.SYN.order,
      };
      break;
    }

    case OP.DEF: {
      const { anchor, path, value } = content;

      if (!anchor && path?.startsWith('_schema.')) {
        setPath(state.schema, path.slice('_schema.'.length), value);
        break;
      }

      if (!anchor) break;
      const entity = state.entities[anchor];
      if (!entity) {
        state._violations.push({ type: 'missing_ins', op: 'DEF', anchor, _ts: ts, _eventId: eventId });
        break;
      }
      if (path) {
        setPath(entity, path, value);
        entity._updated = ts;
        entity._updatedBy = sender;
        if (!entity._fieldTs) entity._fieldTs = {};
        entity._fieldTs[path] = ts;
      }
      if (OP.DEF.order > entity._hwm) entity._hwm = OP.DEF.order;
      break;
    }

    case OP.EVA: {
      const { anchor, criterion, result, note } = content;
      const entity = state.entities[anchor];
      if (!entity) {
        state._violations.push({ type: 'missing_ins', op: 'EVA', anchor, _ts: ts, _eventId: eventId });
        break;
      }

      if (entity._hwm < OP.DEF.order) {
        state._violations.push({
          type: 'criterionless_judgment', op: 'EVA', anchor,
          hwm: entity._hwm, required: OP.DEF.order, _ts: ts, _eventId: eventId,
        });
      }

      if (!entity._evaluations) entity._evaluations = [];
      entity._evaluations.push({ criterion, result, note, _ts: ts, _sender: sender, _eventId: eventId });
      if (OP.EVA.order > entity._hwm) entity._hwm = OP.EVA.order;
      break;
    }

    case OP.REC: {
      const hasAnyEva = Object.values(state.entities).some(e => e._hwm >= OP.EVA.order);
      if (!hasAnyEva && state.frames.length === 0) {
        state._violations.push({ type: 'blind_restructuring', op: 'REC', _ts: ts, _eventId: eventId });
      }

      state.frames.push({ ...content, _ts: ts, _sender: sender, _eventId: eventId });
      break;
    }
  }

  return state;
}

function chronological(events) {
  const ts = (e) => (typeof e?.getTs === 'function' ? e.getTs() : e?.origin_server_ts) || 0;
  const id = (e) => (typeof e?.getId === 'function' ? e.getId() : e?.event_id) || '';
  return events
    .map((e, i) => [e, i])
    .sort((a, b) => {
      const d = ts(a[0]) - ts(b[0]);
      if (d !== 0) return d;
      const ia = id(a[0]), ib = id(b[0]);
      if (ia < ib) return -1;
      if (ia > ib) return 1;
      return a[1] - b[1];
    })
    .map((pair) => pair[0]);
}

function fold(events) {
  return chronological(events).reduce(dispatch, initial());
}

/**
 * Dependency-order check for the "raise dependency issues from going back
 * to the future" ask: given the full (already chronologically-sorted)
 * event list, flag any event whose _ts is EARLIER than an event already
 * folded that it structurally depends on (its own anchor's INS, or for
 * CON/DEF/EVA, the anchor(s) it targets). This is a companion to fold()'s
 * own _violations (which catch a MISSING dependency); this instead catches
 * a dependency that exists but was inserted with a timestamp that puts it
 * chronologically after something that already depended on it — i.e., you
 * un-deleted or re-timestamped an event to a point "in the past" relative
 * to state that was already built from it.
 */
function timeOrderViolations(events) {
  const live = chronological(events.filter((e) => !e._deleted));
  const firstSeenAt = new Map(); // anchor -> earliest ts at which it was INS'd
  const out = [];
  for (const e of live) {
    const type = e.type, c = e.content, ts = e.origin_server_ts || 0;
    const op = parseEventType(type);
    if (!op) continue;
    if (op === OP.INS && c.anchor) {
      if (!firstSeenAt.has(c.anchor)) firstSeenAt.set(c.anchor, ts);
    } else {
      const deps = [];
      if (op === OP.DEF || op === OP.EVA || op === OP.SEG) { if (c.anchor) deps.push(c.anchor); }
      if (op === OP.CON) { if (c.source_anchor) deps.push(c.source_anchor); if (c.target_anchor) deps.push(c.target_anchor); }
      for (const dep of deps) {
        const insAt = firstSeenAt.get(dep);
        if (insAt !== undefined && ts < insAt) {
          out.push({ eventId: e.event_id, dep, eventTs: ts, depInsTs: insAt });
        }
      }
    }
  }
  return out;
}

function entitiesOfType(state, entityType) {
  return Object.values(state.entities).filter(e => e._type === entityType);
}

function currentFrame(state) {
  return state.frames.length > 0 ? state.frames[state.frames.length - 1] : null;
}

let SEED_EVENTS = [];
async function loadSeed() {
  const res = await fetch("municipal-events.json");
  if (!res.ok) throw new Error("municipal-events.json fetch failed: " + res.status);
  return res.json();
}

/* ── storage ── */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      return value === null ? null : { value };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
    },
  };
}
const STORAGE_KEY = "municipal-db-events-v3"; // bumped for the recycle-bin/_deleted-flag shape change
let EVENTS = [];
let state = null;

async function loadEvents() {
  SEED_EVENTS = await loadSeed();
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) { setStorageMsg("loaded from this browser's storage."); return JSON.parse(result.value); }
    throw new Error("empty");
  } catch {
    setStorageMsg("no saved data — seeded fresh from the 5-city corpus.");
    await window.storage.set(STORAGE_KEY, JSON.stringify(SEED_EVENTS), false);
    return SEED_EVENTS.slice();
  }
}
async function saveEvents() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(EVENTS), false); }
  catch (e) { setStorageMsg("storage write FAILED — this add is memory-only: " + e.message, true); }
}
function setStorageMsg(msg, isErr) {
  const el = document.getElementById("storage-status");
  el.textContent = msg; el.style.color = isErr ? "var(--red)" : "";
}

function allEntities() { return Object.values(state.entities); }

const ENTITY_TYPES = ["municipality", "jurisdiction", "obligation", "kind", "parcel", "owner", "standing"];
// sub-zone removed entirely — 0 real rows, already agreed this collapses
// into Ground rather than needing its own table.
// figure removed from the browsable list — not deleted, still real data,

// since nothing reads it independently of its obligation.
// Every type below shares two more fields not listed per-type: source_type
// and source_ref. Universal, mandatory, enforced by the build script itself
// (ins() throws without them) — listed once here rather than duplicated in
// every array, since repeating them 8 times would visually bury the one
// fact that actually matters: they're the same two fields on all of them.
const UNIVERSAL_FIELDS = [["source_type", "text"], ["source_ref", "text"]];
const FIELD_SPECS = {

for (const t of Object.keys(FIELD_SPECS)) FIELD_SPECS[t] = [...FIELD_SPECS[t], ...UNIVERSAL_FIELDS];

let currentView = { kind: "table", type: "municipality" };
let tableSubview = "records";

/* ── sidebar ── */

/* ── table (grid) view ── */
function renderTable(type) {

  items.forEach((e) => Object.keys(e).forEach((k) => { if (!k.startsWith("_")) fieldSet.add(k); }));

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="tv-head"><h2>${type}</h2><span class="crumb">${items.length} row${items.length === 1 ? "" : "s"}</span></div>
    <div class="tv-tabs">
      <button class="tv-tab ${tableSubview === "records" ? "active" : ""}" data-subview="records">records <span class="trows">${items.length}</span></button>
      <button class="tv-tab meta ${tableSubview === "schema" ? "active" : ""}" data-subview="schema">schema</button>
    </div>
    <div class="tv-body ${tableSubview === "schema" ? "pad" : ""}" id="tv-subview"></div>`;

  document.querySelectorAll("[data-subview]").forEach((b) => b.onclick = () => { tableSubview = b.dataset.subview; renderTable(type); });

  const sub = document.getElementById("tv-subview");

    sub.innerHTML = `<div class="ddl"><span class="kw">table</span> <span class="id">${type}</span> {\n${ddlFields}\n}</div>`;
    return;
  }

  sub.innerHTML = `
    <div class="dbtable">
      <div class="dbtable-scroll">
        <table class="grid">
          <thead><tr><th></th>${cols.map((c) => `<th>${c}</th>`).join("")}<th>links</th><th>state</th></tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
    </div>`;

  const tbody = document.getElementById("grid-body");
  tbody.innerHTML = items.map((e, i) => {
    const cons = state.connections.filter((c) => c.source === e._anchor || c.target === e._anchor);
    const partition = state.partitions[e._anchor];
    return `<tr class="row" data-idx="${i}">
      <td>▸</td>
      ${cols.map((c) => `<td>${e[c] !== undefined ? String(e[c]) : ""}</td>`).join("")}
      <td>${cons.length}</td>
      <td>${partition ? `<span style="color:var(--triad-structure);font-weight:700;">${partition}</span>` : (e._evaluations || []).length ? e._evaluations[e._evaluations.length - 1].result : ""}</td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("tr.row").forEach((tr) => {
    tr.addEventListener("click", () => {
      const e = items[Number(tr.dataset.idx)];
      openProfile(e._anchor);
    });
  });
}

/* ── profile panel — every record, one at a time, with drill-down ──
   Matches the real app's own documented behavior ("A record renders a
   profile popup... every field and every related record, grouped by
   relationship. Clicking a related record drills into its profile."). */
let profileStack = [];

function openProfile(anchor) {
  profileStack.push(anchor);
  renderProfile();
}
function goBackProfile() {
  profileStack.pop();
  if (profileStack.length) renderProfile(); else closeProfile();
}
function closeProfile() {
  profileStack = [];
  document.getElementById("profile-overlay").classList.remove("open");
}
const ROUTINE_RELATIONS = new Set(["holds", "subject_to", "owns", "instantiates"]);
function truncate(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function renderFieldValue(key, v) {
  if (typeof v === "string" && (key.endsWith("_url") || key === "code_url") && /^https?:\/\//.test(v)) {
    return `<a href="${v}" target="_blank" rel="noopener" class="field-link">${truncate(v, 60)} ↗</a>`;
  }
  return typeof v === "object" ? JSON.stringify(v) : v;
}
function relSortKey(e) { if (!e) return ""; return (e.section || "") + (e.mark || "") || entityLabel(e); }

function anchorLink(anchor, opts = {}) {
  const e = state.entities[anchor];
  const label = e ? truncate(entityLabel(e), opts.max || 999) : anchor.slice(-10);
  const tag = e ? `<span class="rel-type-tag">${e._type}</span>` : "";
  return `<button class="anchor-link" data-open-anchor="${anchor}">${tag}${label}</button>`;
}

function renderRelGroup(rel, list, otherAnchorFn) {
  const unusual = !ROUTINE_RELATIONS.has(rel);
  const sorted = [...list].sort((a, b) => {
    const ka = relSortKey(state.entities[otherAnchorFn(a)]), kb = relSortKey(state.entities[otherAnchorFn(b)]);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  const SHOWN = 6;
  const visible = sorted.slice(0, SHOWN), rest = sorted.slice(SHOWN);
  const row = (c) => `<div class="rel-row">${anchorLink(otherAnchorFn(c), { max: 54 })}</div>`;
  return `<div class="rel-group ${unusual ? "unusual" : ""}">
    <div class="rel-group-head">${unusual ? "⚠︎ " : ""}${rel} <span class="rel-count">${list.length}</span></div>
    ${visible.map(row).join("")}
    ${rest.length ? `<details class="rel-more"><summary>+${rest.length} more</summary>${rest.map(row).join("")}</details>` : ""}
  </div>`;
}

function renderProfile() {
  const anchor = profileStack[profileStack.length - 1];
  const e = state.entities[anchor];
  const overlay = document.getElementById("profile-overlay");
  overlay.classList.add("open");
  if (!e) {
    document.getElementById("profile-body").innerHTML = `<p class="hint" style="padding:16px;">No such entity (it may only exist as a raw event, e.g. a schema-only DEF, or it may have been undone — check the recycle bin).</p>`;
    return;
  }

  const crumbs = profileStack.map((a, i) => {
    const ent = state.entities[a];
    const label = ent ? entityLabel(ent) : a.slice(-8);
    return i === profileStack.length - 1 ? `<b>${label}</b>` : `<button class="crumb-link" data-crumb-idx="${i}">${label}</button>`;
  }).join(" <span class='crumb-sep'>›</span> ");
  document.getElementById("profile-crumbs").innerHTML = crumbs;

  const fields = Object.entries(e).filter(([k]) => !k.startsWith("_"));
  const outgoing = state.connections.filter((c) => c.source === anchor && c.type !== "figured-as"); // figured-as renders inline below, not as a generic related-record chip
  const incoming = state.connections.filter((c) => c.target === anchor);
  const groupBy = (list, keyFn) => list.reduce((acc, item) => { const k = keyFn(item); (acc[k] = acc[k] || []).push(item); return acc; }, {});
  const outGroups = groupBy(outgoing, (c) => c.type);
  const inGroups = groupBy(incoming, (c) => c.type);

  const figureEdge = state.connections.find((c) => c.source === anchor && c.type === "figured-as");
  const figure = figureEdge ? state.entities[figureEdge.target] : null;

  document.getElementById("profile-body").innerHTML = `
    <div class="profile-title"><span class="profile-type">${e._type}</span>${entityLabel(e)}</div>
    <div class="profile-anchor">${e._anchor}</div>
    ${state.partitions[anchor] ? `<div class="partition">stage: ${state.partitions[anchor]}</div>` : ""}
    ${e._eventId ? `<button class="profile-undo-btn" data-undo-event="${e._eventId}">↺ undo this record's creation</button>` : ""}

    <div class="profile-section-head">fields</div>
    <table class="profile-fields">${fields.map(([k, v]) => `<tr><td class="pf-key">${k}</td><td class="pf-val">${renderFieldValue(k, v)}</td></tr>`).join("") || `<tr><td class="pf-key" colspan="2" style="font-style:italic;color:var(--text-faint);">none</td></tr>`}</table>

    ${figure ? `<div class="profile-section-head">figure — parameter reading on this clause, not its own record</div>
      <table class="profile-fields">
        <tr><td class="pf-key">party</td><td class="pf-val">${figure.party ?? "<i>not mechanically parseable</i>"}</td></tr>
        <tr><td class="pf-key">modality</td><td class="pf-val">${figure.modality ?? ""}</td></tr>
        <tr><td class="pf-key">extraction_method</td><td class="pf-val" style="font-size:11px;color:var(--text-dim);">${figure.extraction_method ?? ""}</td></tr>
      </table>` : ""}

    ${(e._evaluations || []).length ? `<div class="profile-section-head">judgments</div>
      ${e._evaluations.map((ev) => `<div class="profile-judgment ${ev.result}">
          <div class="profile-judgment-head">${ev.criterion}: <span class="pj-result">${ev.result.replace(/_/g, " ")}</span></div>
          ${ev.note ? `<div class="profile-judgment-note">${ev.note}</div>` : ""}
          ${ev._eventId ? `<button class="profile-undo-btn" data-undo-event="${ev._eventId}">↺ undo this judgment</button>` : ""}
        </div>`).join("")}` : ""}

    ${Object.keys(outGroups).length ? `<div class="profile-section-head">related — this record →</div>
      ${Object.keys(outGroups).sort().map((rel) => renderRelGroup(rel, outGroups[rel], (c) => c.target)).join("")}` : ""}

    ${Object.keys(inGroups).length ? `<div class="profile-section-head">related — ← this record</div>
      ${Object.keys(inGroups).sort().map((rel) => renderRelGroup(rel, inGroups[rel], (c) => c.source)).join("")}` : ""}
  `;

  document.querySelectorAll("[data-open-anchor]").forEach((b) => b.onclick = () => openProfile(b.dataset.openAnchor));
  document.querySelectorAll("[data-crumb-idx]").forEach((b) => b.onclick = () => { profileStack = profileStack.slice(0, Number(b.dataset.crumbIdx) + 1); renderProfile(); });
  document.querySelectorAll("[data-undo-event]").forEach((b) => b.onclick = () => undoEvent(b.dataset.undoEvent));
}

/* ── recycle bin / undo ──
   "Undo" never deletes an event from EVENTS — it flips a `_deleted` flag,
   which dispatch() treats as a no-op. That keeps the event addressable
   (so it can be restored) and keeps the log itself append-only, matching
   the rest of this app's event-sourced design: nothing is ever actually
   erased, states are recomputed by re-folding. */
function findEventById(id) { return EVENTS.find((e) => e.event_id === id); }

async function undoEvent(eventId) {
  const ev = findEventById(eventId);
  if (!ev) return;
  ev._deleted = true;
  ev._deletedAt = Date.now();
  state = fold(EVENTS);
  await saveEvents();
  closeProfile();
  renderChrome();
}
async function restoreEvent(eventId) {
  const ev = findEventById(eventId);
  if (!ev) return;
  delete ev._deleted;
  delete ev._deletedAt;
  state = fold(EVENTS);
  await saveEvents();
  renderChrome();
}

function renderTrash() {
  const main = document.getElementById("main");
  const deleted = EVENTS.filter((e) => e._deleted).sort((a, b) => (b._deletedAt || 0) - (a._deletedAt || 0));
  main.innerHTML = `<div class="tv-head"><h2>recycle bin</h2><span class="crumb">${deleted.length} undone event${deleted.length === 1 ? "" : "s"} — restorable, never hard-deleted</span></div><div class="tv-body"><div class="timeline" id="tl"></div></div>`;
  const tlA = (anchor) => `<button class="tl-anchor-link" data-open-anchor="${anchor}">${anchor.slice(-10)}</button>`;
  document.getElementById("tl").innerHTML = deleted.length ? deleted.map((e) => {
    const op = TYPE_TO_OP[e.type]; if (!op) return "";
    const c = e.content;
    let body = "";
    if (op === OP.INS) body = `${tlA(c.anchor)} · <span class="tl-path">${c.entity_type}</span>`;
    else if (op === OP.CON) body = `${tlA(c.source_anchor)} -[<span class="tl-rel">${c.relation_type}</span>]→ ${tlA(c.target_anchor)}`;
    else if (op === OP.DEF) body = `${c.anchor ? tlA(c.anchor) : "_schema"} · <span class="tl-path">${c.path}</span>`;
    else if (op === OP.EVA) body = `${tlA(c.anchor)} · <span class="tl-path">${c.criterion}</span>`;
    else if (op === OP.SEG) body = `${tlA(c.anchor)} → <span class="tl-rel">${c.partition}</span>`;
    else body = e.event_id;
    return `<div class="tl-row"><div class="tl-glyph ${op.triad}">${op.glyph}</div><div class="tl-key">${op.key}</div><div class="tl-body">${body}</div><button class="tl-undo" data-restore-event="${e.event_id}">↺ restore</button></div>`;
  }).join("") : `<p style="padding:16px;color:var(--text-faint);font-style:italic;">nothing in the bin</p>`;
  document.querySelectorAll("[data-open-anchor]").forEach((b) => b.onclick = () => openProfile(b.dataset.openAnchor));
  document.querySelectorAll("[data-restore-event]").forEach((b) => b.onclick = () => restoreEvent(b.dataset.restoreEvent));
}

/* ── timeline (raw event log) ── */
const TYPE_TO_OP = { "io.matrix-events.ins": OP.INS, "io.matrix-events.con": OP.CON, "io.matrix-events.def": OP.DEF, "io.matrix-events.eva": OP.EVA, "io.matrix-events.rec": OP.REC, "io.matrix-events.seg": OP.SEG, "io.matrix-events.syn": OP.SYN };
function renderTimeline() {
  const main = document.getElementById("main");
  const violations = timeOrderViolations(EVENTS);
  const violByEvent = new Map(violations.map((v) => [v.eventId, v]));
  main.innerHTML = `<div class="tv-head"><h2>event log</h2><span class="crumb">${EVENTS.filter((e) => !e._deleted).length} live events (${EVENTS.filter((e) => e._deleted).length} in recycle bin), most recent first, capped at 500 shown</span>${violations.length ? `<span class="crumb" style="color:var(--signal);">⚠ ${violations.length} time-order issue${violations.length === 1 ? "" : "s"} (an event dated before something that already depends on it)</span>` : ""}</div><div class="tv-body"><div class="timeline" id="tl"></div></div>`;
  const rows = EVENTS.slice().reverse().slice(0, 500);
  const tlA = (anchor) => `<button class="tl-anchor-link" data-open-anchor="${anchor}">${anchor.slice(-10)}</button>`;
  document.getElementById("tl").innerHTML = rows.map((e, i) => {
    const op = TYPE_TO_OP[e.type]; if (!op) return "";
    const c = e.content;
    let body = "";
    if (op === OP.INS) body = `${tlA(c.anchor)} · <span class="tl-path">${c.entity_type}</span> <span class="tl-val">${JSON.stringify(c.payload).slice(0, 70)}</span>`;
    else if (op === OP.CON) body = `${tlA(c.source_anchor)} -[<span class="tl-rel">${c.relation_type}</span>]→ ${tlA(c.target_anchor)}`;
    else if (op === OP.DEF) body = `${c.anchor ? tlA(c.anchor) : `<span class="tl-anchor">_schema</span>`} · <span class="tl-path">${c.path}</span> = <span class="tl-val">${JSON.stringify(c.value)}</span>`;
    else if (op === OP.EVA) body = `${tlA(c.anchor)} · <span class="tl-path">${c.criterion}</span> ⇒ <span class="tl-val">${c.result}</span>`;
    else if (op === OP.SEG) body = `${tlA(c.anchor)} → <span class="tl-rel">${c.partition}</span>`;
    else if (op === OP.REC) body = `<span class="tl-path">${c.scope}</span> recontextualized`;
    else if (op === OP.SYN) body = `[${(c.input_anchors || []).map(tlA).join(", ")}] → <span class="tl-val">${JSON.stringify(c.output).slice(0, 60)}</span>`;
    const viol = violByEvent.get(e.event_id);
    const undoBtn = !e._deleted ? `<button class="tl-undo" data-undo-event="${e.event_id}" title="undo (moves to recycle bin)">↺</button>` : "";
    const warnBtn = viol ? `<span class="tl-warn" title="dated ${viol.eventTs} but depends on ${viol.dep.slice(-10)} which wasn't created until ${viol.depInsTs} — this event arrived 'from the future' relative to its own dependency">⚠ time-order</span>` : "";
    return `<div class="tl-row ${e._deleted ? "reverted" : ""}"><div class="tl-idx">#${String(EVENTS.length - i).padStart(3, "0")}</div><div class="tl-glyph ${op.triad}">${op.glyph}</div><div class="tl-key">${op.key}</div><div class="tl-body">${body}</div>${warnBtn}<div class="tl-sender">${e.sender}</div>${undoBtn}</div>`;
  }).join("");
  document.querySelectorAll("[data-open-anchor]").forEach((b) => b.onclick = () => openProfile(b.dataset.openAnchor));
  document.querySelectorAll("[data-undo-event]").forEach((b) => b.onclick = () => undoEvent(b.dataset.undoEvent));
}

/* ── chrome ── */
function renderChrome() {
  const violations = timeOrderViolations(EVENTS);
  document.getElementById("stats").innerHTML = `
    <span><b>${Object.keys(state.entities).length}</b> entities</span>
    <span><b>${state.connections.length}</b> edges</span>
    <span><b>${state.frames.length}</b> frames</span>
    <span class="${state._violations.length ? "bad" : "ok"}">${state._violations.length === 0 ? "0 violations" : state._violations.length + " violations"}</span>
    ${violations.length ? `<span class="bad">${violations.length} time-order issue${violations.length === 1 ? "" : "s"}</span>` : ""}
    ${EVENTS.some((e) => e._deleted) ? `<span>${EVENTS.filter((e) => e._deleted).length} in bin</span>` : ""}`;
  renderSidebar();
  if (currentView.kind === "table") renderTable(currentView.type);
  else if (currentView.kind === "log") renderTimeline();
  else if (currentView.kind === "trash") renderTrash();
}

document.getElementById("reset-btn").addEventListener("click", async () => {
  if (!confirm("Discard everything added beyond the 5-city seed corpus?")) return;
  if (!SEED_EVENTS.length) SEED_EVENTS = await loadSeed();
  EVENTS = SEED_EVENTS.slice();
  state = fold(EVENTS);
  await saveEvents();
  setStorageMsg("reset to the seed corpus.");
  renderChrome();
});

document.getElementById("profile-close").addEventListener("click", closeProfile);
document.getElementById("profile-backdrop").addEventListener("click", closeProfile);
document.getElementById("profile-back").addEventListener("click", goBackProfile);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && profileStack.length) closeProfile(); });

loadEvents().then((evs) => { EVENTS = evs; state = fold(EVENTS); renderChrome(); });
</script>
</body>
