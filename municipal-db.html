            <div class="cmp-compact">${x.listing.title}</div>
            <div style="margin-top:4px;display:flex;gap:4px;align-items:center;">
              ${x.reg && x.reg.status === "active" ? `<span class="cmp-chip ok">registered</span>` : `<span class="cmp-chip bad">unregistered</span>`}
              <span class="cmp-compact" style="margin-left:6px;">${x.listing.platform}</span>
              <button class="cmp-btn danger" style="margin-left:auto;font-size:9px;padding:1px 4px;" data-del-listing="${x.listing._anchor}" title="delete listing">✕</button>
            </div>
          </div>
        `).join("")}
        ${deletedListings.length ? `
          <div class="cmp-section-head">deleted (restorable)</div>
          ${deletedListings.map((x) => `
            <div style="padding:6px 14px;border-bottom:1px solid var(--border);opacity:.5;">
              <div style="font-size:11px;text-decoration:line-through;">${x.parcel?.address || "—"}</div>
              <button class="cmp-btn" style="font-size:9px;padding:1px 4px;" data-rest-listing="${x.listing._anchor}">↺ restore</button>
            </div>
          `).join("")}
        ` : ""}
      </div>
      <div style="overflow-y:auto;padding:16px;">
        ${selListing ? `
          <div class="cmp-card">
            <div class="cmp-card-head">
              <span class="cmp-chip info">${selListing.listing.platform}</span>
              <span class="cmp-card-title">${selListing.parcel?.address}</span>
              <a href="${selListing.listing.url}" target="_blank" class="cmp-btn">view listing ↗</a>
            </div>
            <div class="cmp-card-body">
              <b>title:</b> <span data-edit-field="title" data-edit-entity="${selListing.listing._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;">${selListing.listing.title}</span> ✎<br>
              <b>zoning:</b> <span class="cmp-chip info">${selListing.parcel?.zoning || "—"}</span> <span data-edit-field="zoning" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;font-size:10px;">✎</span><br>
              <b>property type:</b> <span class="cmp-chip info">${selListing.parcel?.property_type || "—"}</span> <span data-edit-field="property_type" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;font-size:10px;">✎</span><br>
              <b>state:</b> ${selListing.parcel?.state || "—"} <span data-edit-field="state" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;font-size:10px;">✎</span><br>
              <b>bedrooms:</b> <span data-edit-field="bedrooms" data-edit-entity="${selListing.parcel._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;">${selListing.parcel?.bedrooms}</span> ✎ · 
              <b>bathrooms:</b> <span data-edit-field="bathrooms" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;">${selListing.parcel?.bathrooms || "—"}</span> ✎ · 
              <b>units:</b> <span data-edit-field="units" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;">${selListing.parcel?.units || "—"}</span> ✎<br>
              <b>partition:</b> <span class="cmp-chip ${selListing.parcel?._partition === "resolved" ? "ok" : selListing.parcel?._partition === "violated" ? "bad" : selListing.parcel?._partition === "deleted" ? "muted" : "warn"}">${selListing.parcel?._partition || "open"}</span> <span data-edit-field="partition" data-edit-entity="${selListing.parcel?._anchor}" style="border-bottom:1px dashed var(--border);cursor:pointer;font-size:10px;">✎</span><br>
              <b>registration status:</b> ${selListing.reg ? `<span style="color:var(--triad-existence);font-weight:700;">active (${selListing.reg.license_number})</span>` : `<span style="color:var(--triad-significance);font-weight:700;">none on file</span>`}
            </div>
          </div>
          <div class="cmp-section-head" style="margin-top:0;">registration fee calculator & amounts owed</div>
          <div class="cmp-card"><div class="cmp-card-body">
            <b>computed fee:</b> ${feeCalc?.text}<br>
            <b>fee amount:</b> ${feeCalc?.amount !== null ? `<span style="font-size:15px;font-weight:700;color:var(--text-bright);">$${feeCalc.amount.toFixed(2)}</span>` : "<i>delegated / not numeric in corpus</i>"}<br>
            <div class="cmp-note">Rule read from fee-schedule entity for ${muni}. Principal residence exemption automatically checked against owner mailing address.</div>
          </div></div>
          <div class="cmp-section-head">hotel & occupancy tax estimator (${muni})</div>
          <div class="cmp-card"><div class="cmp-card-body">
            <div class="cmp-field-row"><label>booking revenue</label><div class="cmp-val"><input type="number" id="tax-rev-input" value="${compTaxRev}"></div></div>
            <div class="cmp-field-row"><label>period</label><div class="cmp-val">
              <select id="tax-per-sel" class="cmp-select">
                <option value="monthly" ${compTaxPeriod === "monthly" ? "selected" : ""}>monthly</option>
                <option value="quarterly" ${compTaxPeriod === "quarterly" ? "selected" : ""}>quarterly</option>
                <option value="annual" ${compTaxPeriod === "annual" ? "selected" : ""}>annual</option>
              </select>
            </div></div>
            <div class="cmp-divider"></div>
            <b>estimated tax (${(taxEst.totalRate * 100).toFixed(1)}% total rate):</b> <span style="font-size:15px;font-weight:700;color:var(--triad-structure);">$${taxEst.amount.toFixed(2)}</span> (${compTaxPeriod})<br>
            <div class="cmp-compact" style="margin-top:6px;">
              <b>components:</b><br>
              ${taxEst.components.map((c) => `&nbsp;• ${c.label}: ${(c.rate * 100).toFixed(1)}% ($${c.calc.toFixed(2)}) — <span style="color:var(--text-faint);">${c.citation}</span>`).join("<br>")}
            </div>
          </div></div>
          <div class="cmp-section-head">obligations & standing history for this parcel</div>
          <div class="cmp-card"><div class="cmp-card-body">
            ${state.connections.filter((c) => c.type === "opened_against" && c.target === parcel?._anchor).map((c) => {
              const st = state.entities[c.source];
              const part = state.partitions[c.source] || "open";
              const grounds = state.connections.find((x) => x.type === "grounds_in" && x.source === c.source);
              const ob = grounds ? state.entities[grounds.target] : null;
              return `<div style="padding:4px 0;border-bottom:1px solid var(--surface-3);">
                <b>${st?.distinction}</b><br>
                <span class="cmp-compact">obligation: ${ob?.holder} ${ob?.section} · partition: <span style="font-weight:700;color:${part === "resolved" ? "var(--triad-existence)" : part === "violated" ? "var(--triad-significance)" : "var(--signal)"};">${part}</span></span>
              </div>`;
            }).join("") || `<div class="cmp-empty">No standings opened against this parcel.</div>`}
          </div></div>
          <div class="cmp-section-head">revision history (all field changes)</div>
          <div class="cmp-card"><div class="cmp-card-body">
            ${renderDefHistory(selListing.listing._anchor, selListing.listing)}
          </div></div>
        ` : `<div class="cmp-empty">Select a property on the left.</div>`}
      </div>
    </div>
  `;

  document.getElementById("cmp-owner-sel").onchange = (ev) => { compOwner = ev.target.value; renderCompliance(); };
  document.querySelectorAll("[data-sel-listing]").forEach((el) => el.onclick = () => { compSelParcel = el.dataset.selListing; renderCompliance(); });
  document.querySelectorAll("[data-del-listing]").forEach((el) => el.onclick = (ev) => { ev.stopPropagation(); deleteEntity(el.dataset.delListing); });
  document.querySelectorAll("[data-rest-listing]").forEach((el) => el.onclick = (ev) => { ev.stopPropagation(); restoreEntity(el.dataset.restListing); });
  document.querySelectorAll("[data-edit-field]").forEach((el) => el.onclick = (ev) => {
    ev.stopPropagation();
    const entityAnchor = el.dataset.editEntity;
    const field = el.dataset.editField;
    const entity = state.entities[entityAnchor];
    if (!entity) return;
    const currentVal = entity[field] ?? "";
    // Check if this is a select field
    const parcelSpec = FIELD_SPECS.parcel || [];
    const fieldDef = parcelSpec.find(([k]) => k === field);
    if (fieldDef && fieldDef[1] === "select") {
      // Create a select dropdown for editing
      const options = fieldDef[2] || [];
      const selectHtml = `<select id="edit-select-${field}" style="position:absolute;z-index:1000;background:#fff;border:1px solid #000;padding:4px;">
        ${options.map((opt) => `<option value="${opt}" ${opt === currentVal ? "selected" : ""}>${opt}</option>`).join("")}
      </select>`;
      el.innerHTML = selectHtml;
      const sel = document.getElementById(`edit-select-${field}`);
      sel.focus();
      sel.onchange = () => {
        emitFieldDef(entityAnchor, field, sel.value);
      };
      sel.onblur = () => {
        setTimeout(() => { if (document.getElementById(`edit-select-${field}`)) renderCompliance(); }, 200);
      };
    } else {
      const newVal = prompt(`Edit "${field}" for ${entityAnchor.slice(0, 20)}...`, currentVal);
      if (newVal !== null && newVal !== currentVal) {
        emitFieldDef(entityAnchor, field, isNaN(newVal) ? newVal : Number(newVal));
      }
    }
  });
  const revIn = document.getElementById("tax-rev-input");
  if (revIn) revIn.onchange = (ev) => { compTaxRev = Number(ev.target.value) || 0; };
  const perSel = document.getElementById("tax-per-sel");
  if (perSel) perSel.onchange = (ev) => { compTaxPeriod = ev.target.value; renderCompliance(); };
}
function renderCmpGovernment(bdy, dets) {
  bdy.className = "cmp-body scroll";
  const activeItems = dets.allItems.filter((x) => !isDeleted(x.listing) && !isDeleted(x.parcel));
  const deletedItems = dets.allItems.filter((x) => isDeleted(x.listing) || isDeleted(x.parcel));
  const activeUnregistered = activeItems.filter((x) => !x.reg || x.reg.status !== "active");
  const activeEvidence = activeItems.reduce((acc, x) => {
    const bookings = x.listing.bookings || [];
    bookings.forEach((b) => { if (b.to >= "2026-09-11") acc.push({ ...x, booking: b }); });
    return acc;
  }, []).sort((a, b) => a.booking.from.localeCompare(b.booking.from));
  const activeNonOwnerRes = activeItems.filter((x) => {
    if (!x.parcel || !x.owner) return false;
    const zoning = (x.parcel.zoning || "").toUpperCase();
    const isRes = zoning.startsWith("R") || zoning.includes("RES");
    const mail = (x.owner.mailing_address || "").toLowerCase();
    const addr = (x.parcel.address || "").toLowerCase();
    const isDifferent = mail.includes("po box") || !addr.split(",")[0].trim().split(" ").every((w) => mail.includes(w));
    return isRes && isDifferent;
  });
  const byStreet = new Map();
  activeItems.forEach((x) => {
    if (!x.parcel) return;
    const st = (x.parcel.address || "").replace(/^[\d\-]+ /, "").replace(/ Unit.*| #[0-9]+.*/, "").trim();
    if (!byStreet.has(st)) byStreet.set(st, []);
    byStreet.get(st).push(x);
  });
  const activeStreetDensity = [...byStreet.entries()].filter(([st, list]) => list.length >= 3);
  const byOwner = new Map();
  activeItems.forEach((x) => {
    if (!x.owner) return;
    const name = x.owner.name;
    if (!byOwner.has(name)) byOwner.set(name, []);
    byOwner.get(name).push(x);
  });
  const activeOwnerConcentration = [...byOwner.entries()].filter(([name, list]) => list.length >= 2);

  bdy.innerHTML = `
    <div class="cmp-city-tabs">
      <span style="font-size:11px;font-weight:700;color:var(--text-dim);margin-right:4px;">city scope:</span>
      ${["all", "middletown", "chicago", "staugustine", "talent", "ftworth"].map((c) => `<button class="cmp-city ${compCity === c ? "active" : ""}" data-gov-city="${c}">${c}</button>`).join("")}
    </div>
    ${compGovTab === "unregistered" ? `
      <div class="cmp-section-head">unregistered str's requiring a license & registration (${activeUnregistered.length})</div>
      <div class="cmp-card"><div class="cmp-card-body">
        ${activeUnregistered.length ? activeUnregistered.map((x) => `
          <div style="padding:6px 0;border-bottom:1px solid var(--surface-3);display:flex;align-items:center;gap:10px;">
            <div style="flex:1;">
              <b>${x.parcel?.address || "—"}</b><br>
              <span class="cmp-compact">${x.listing.platform} · title: "${x.listing.title}" · owner: ${x.owner?.name}</span>
            </div>
            <button class="cmp-btn" style="font-size:10px;" data-edit-listing="${x.listing._anchor}">edit</button>
            <button class="cmp-btn danger" style="font-size:10px;" data-del-listing="${x.listing._anchor}">delete</button>
            <button class="cmp-btn danger" data-insp-btn="${x.parcel?._anchor}" data-list-anchor="${x.listing._anchor}">create inspection task</button>
          </div>
        `).join("") : `<div class="cmp-empty">No unregistered STRs found in scope.</div>`}
      </div></div>
    ` : compGovTab === "evidence" ? `
      <div class="cmp-section-head">upcoming dates with bookings (inspector evidence gathering)</div>
      <div class="cmp-card"><div class="cmp-card-body">
        ${activeEvidence.length ? activeEvidence.map((x) => `
          <div style="padding:6px 0;border-bottom:1px solid var(--surface-3);display:flex;align-items:center;gap:10px;">
            <div style="width:140px;">
              <span class="cmp-evidence-date">${x.booking.from}</span> → <span class="cmp-evidence-date">${x.booking.to}</span>
            </div>
            <div style="flex:1;">
              <b>${x.parcel?.address}</b><br>
              <span class="cmp-compact">${x.listing.platform} · ${x.listing.title}</span>
            </div>
            <button class="cmp-btn primary" data-insp-btn="${x.parcel?._anchor}" data-list-anchor="${x.listing._anchor}">schedule inspection</button>
          </div>
        `).join("") : `<div class="cmp-empty">No upcoming bookings found.</div>`}
      </div></div>
    ` : compGovTab === "illegal" ? `
      <div class="cmp-section-head">non-owner occupied str's in residential zones (${activeNonOwnerRes.length})</div>
      <div class="cmp-grid"><table>
        <thead><tr><th>address</th><th>zoning</th><th>owner mailing address</th><th>actions</th><th>note</th></tr></thead>
        <tbody>
          ${activeNonOwnerRes.map((x) => `<tr>
            <td><b>${x.parcel?.address}</b></td>
            <td><span class="cmp-chip warn">${x.parcel?.zoning}</span></td>
            <td>${x.owner?.mailing_address}</td>
            <td><button class="cmp-btn" style="font-size:10px;" data-edit-listing="${x.listing._anchor}">edit</button> <button class="cmp-btn danger" style="font-size:10px;" data-del-listing="${x.listing._anchor}">delete</button></td>
            <td class="cmp-compact">Owner mailing differs from property; residential zone.</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
      <div class="cmp-section-head">proximity & density clusters</div>
      <div class="cmp-card"><div class="cmp-card-body">
        <b>street density clusters (>3 listings per street):</b><br>
        ${activeStreetDensity.map(([st, list]) => `&nbsp;• <b>${st}</b>: ${list.length} listings (${list.map((x) => x.parcel?.address.split(",")[0]).join(", ")})`).join("<br>") || "<i>None</i>"}<br><br>
        <b>owner concentration (>2 listings per owner):</b><br>
        ${activeOwnerConcentration.map(([name, list]) => `&nbsp;• <b>${name}</b>: ${list.length} properties (${list.map((x) => x.parcel?.address.split(",")[0]).join(", ")})`).join("<br>") || "<i>None</i>"}
      </div></div>
    ` : `
      <div class="cmp-section-head">listing completeness verification (required information)</div>
      <div class="cmp-grid"><table>
        <thead><tr><th>listing & platform</th><th>license displayed</th><th>parking plan</th><th>units / bedrooms</th><th>status</th><th>actions</th></tr></thead>
        <tbody>
          ${activeItems.map((x) => {
            const hasLic = Boolean(x.listing.property && x.listing.property.license_number);
            const hasPark = Boolean(x.listing.property && x.listing.property.parking_plan);
            const ok = hasLic && hasPark;
            return `<tr>
              <td><b>${x.parcel?.address.split(",")[0]}</b><br><span class="cmp-compact">${x.listing.platform} · ${x.listing.title}</span></td>
              <td>${hasLic ? `<span class="cmp-chip ok">${x.listing.property.license_number}</span>` : `<span class="cmp-chip bad">missing</span>`}</td>
              <td>${hasPark ? x.listing.property.parking_plan : `<span class="cmp-chip bad">missing</span>`}</td>
              <td>${x.listing.property.units} unit / ${x.listing.property.bedrooms} br</td>
              <td>${ok ? `<span class="cmp-chip ok">pass</span>` : `<span class="cmp-chip bad">review</span>`}</td>
              <td><button class="cmp-btn" style="font-size:10px;" data-edit-listing="${x.listing._anchor}">edit</button> <button class="cmp-btn danger" style="font-size:10px;" data-del-listing="${x.listing._anchor}">delete</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
    `}
    ${deletedItems.length ? `
      <div class="cmp-section-head">deleted listings (restorable)</div>
      <div class="cmp-card"><div class="cmp-card-body">
        ${deletedItems.map((x) => `
          <div style="padding:4px 0;border-bottom:1px solid var(--surface-3);opacity:.5;display:flex;align-items:center;gap:10px;">
            <span style="text-decoration:line-through;font-size:11px;">${x.parcel?.address || "—"}</span>
            <button class="cmp-btn" style="font-size:10px;" data-rest-listing="${x.listing._anchor}">↺ restore</button>
          </div>
        `).join("")}
      </div></div>
    ` : ""}
  `;

  document.querySelectorAll("[data-gov-city]").forEach((b) => b.onclick = () => { compCity = b.dataset.govCity; renderCompliance(); });
  document.querySelectorAll("[data-insp-btn]").forEach((b) => b.onclick = () => {
    const parcelAnchor = b.dataset.inspBtn;
    const listAnchor = b.dataset.listAnchor;
    emitComplianceEvent("inspection", {
      planned_for: "2026-09-20", focus: "evidence verifying unlicensed / illegal operation",
      note: "Inspector dispatched following compliance workbench trigger.",
      listing: [listAnchor], parcel: [parcelAnchor], created_at: new Date().toISOString().slice(0, 10),
    }, [[parcelAnchor, parcelAnchor, "targets"], [listAnchor, parcelAnchor, "scheduled_for"]]);
  });
  document.querySelectorAll("[data-edit-listing]").forEach((el) => el.onclick = () => {
    const anchor = el.dataset.editListing;
    const entity = state.entities[anchor];
    if (!entity) return;
    const fields = Object.keys(entity).filter((k) => !k.startsWith("_"));
    const field = prompt(`Edit field for listing ${anchor.slice(0, 20)}...\nAvailable: ${fields.join(", ")}`, "title");
    if (!field || !fields.includes(field)) return;
    const currentVal = entity[field] ?? "";
    const newVal = prompt(`Edit "${field}"`, typeof currentVal === "object" ? JSON.stringify(currentVal) : currentVal);
    if (newVal !== null && newVal !== currentVal) {
      try {
        const parsed = JSON.parse(newVal);
        emitFieldDef(anchor, field, parsed);
      } catch {
        emitFieldDef(anchor, field, isNaN(newVal) ? newVal : Number(newVal));
      }
    }
  });
  document.querySelectorAll("[data-del-listing]").forEach((el) => el.onclick = () => { deleteEntity(el.dataset.delListing); });
  document.querySelectorAll("[data-rest-listing]").forEach((el) => el.onclick = () => { restoreEntity(el.dataset.restListing); });
}

/* ── chrome ── */
function renderChrome() {
  const violations = timeOrderViolations(EVENTS);
  document.getElementById("stats").innerHTML = `
    <span><b>${Object.keys(state.entities).length}</b> entities</span>
    <span><b>${state.connections.length}</b> edges</span>
    <span><b>${state.frames.length}</b> frames</span>
    <span class="${state._violations.length ? "bad" : "ok"}">${state._violations.length === 0 ? "0 violations" : state._violations.length + " violations"}</span>
    ${violations.length ? `<span class="bad">${violations.length} time-order issue${violations.length === 1 ? "" : "s"}</span>` : ""}
    ${EVENTS.some((e) => e._deleted) ? `<span>${EVENTS.filter((e) => e._deleted).length} in bin</span>` : ""}`;
  renderSidebar();
  if (currentView.kind === "table") renderTable(currentView.type);
  else if (currentView.kind === "log") renderTimeline();
  else if (currentView.kind === "trash") renderTrash();
  else if (currentView.kind === "compliance") renderCompliance();
}

document.getElementById("reset-btn").addEventListener("click", async () => {
  if (!confirm("Discard everything added beyond the 5-city seed corpus?")) return;
  if (!SEED_EVENTS.length) SEED_EVENTS = await loadSeed();
  EVENTS = SEED_EVENTS.slice();
  state = fold(EVENTS);
  await saveEvents();
  setStorageMsg("reset to the seed corpus.");
  renderChrome();
});

document.getElementById("profile-close").addEventListener("click", closeProfile);
document.getElementById("profile-backdrop").addEventListener("click", closeProfile);
document.getElementById("profile-back").addEventListener("click", goBackProfile);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && profileStack.length) closeProfile(); });

loadEvents().then((evs) => { EVENTS = evs; state = fold(EVENTS); renderChrome(); });
</script>
